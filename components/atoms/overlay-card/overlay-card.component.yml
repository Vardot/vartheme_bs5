$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Overlay Card
group: Card
status: stable
description: Overlay card with background media (uploaded) and a drag & drop content slot. Bootstrap 5, Canvas + SDC safe.
props:
  type: object
  properties:
    card_border:
      type: boolean
      title: Card border
      default: false

    padded:
      type: string
      title: Content padding
      description: Padding applied to the content overlay area.
      default: medium
      enum: [small, medium, large, x_large]
      meta:enum:
        small: Small
        medium: Medium
        large: Large
        x_large: Extra Large

    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: none
      enum: [none, shadow-sm, shadow, shadow-lg, shadow-xl]
      meta:enum:
        none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
        shadow-xl: Extra Large

    card_height:
      type: string
      title: Card size
      description: Standard card size for consistent overlay layouts (use with vertical alignment).
      default: medium
      enum: [auto, small, medium, large, x_large]
      meta:enum:
        auto: Auto
        small: Small
        medium: Medium
        large: Large
        x_large: Extra Large

    overlay_color:
      type: string
      title: Overlay color
      description: Adds a color overlay on top of the background image to improve readability.
      default: none
      enum:
        - none
        - dark_25
        - dark_50
        - dark_75
        - light_25
        - light_50
        - primary_25
        - primary_50
        - secondary_25
        - secondary_50
      meta:enum:
        none: None
        dark_25: Dark (25%)
        dark_50: Dark (50%)
        dark_75: Dark (75%)
        light_25: Light (25%)
        light_50: Light (50%)
        primary_25: Primary (25%)
        primary_50: Primary (50%)
        secondary_25: Secondary (25%)
        secondary_50: Secondary (50%)

    equal_height:
      type: boolean
      title: Equal height
      default: false

    anchor_all:
      type: boolean
      title: Anchor all (whole card)
      default: true

    h_align:
      type: string
      title: Horizontal alignment
      default: start
      enum: [start, center, end]
      meta:enum:
        start: Start
        center: Center
        end: End

    v_align:
      type: string
      title: Vertical alignment
      default: center
      enum: [start, center, end]
      meta:enum:
        start: Start
        center: Center
        end: End

    link_url:
      type: string
      title: Card link
      description: Optional link URL. Used for Anchor all or for content linking.
      default: ""

    link_target:
      type: string
      title: Link target
      default: default
      enum: [default, _blank]
      meta:enum:
        default: Same window
        _blank: New tab

    media_image:
      # IMPORTANT: Drupal Canvas only knows how to populate image props when they
      # match Canvas' built-in image schema.
      # See: https://project.pages.drupalcode.org/canvas/sdc-components/image/
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Card media (background image)
      description: Upload/select an image to be used as the background. If empty, a placeholder image is used.
      examples:
        - src: /themes/contrib/vartheme_bs5/components/atoms/overlay-card/assets/overlay-card-image-placeholder.svg
          alt: Overlay card placeholder image
          width: 1200
          height: 675

    html_id:
      type: string
      title: HTML ID
      default: ""

    extra_classes:
      type: string
      title: HTML classes
      default: ""

slots:
  content:
    title: Card content
    description: Drag & drop any component here.
