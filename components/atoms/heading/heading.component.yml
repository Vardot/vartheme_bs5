$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Heading
group: Base
status: stable
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading text
      default: "Enter title"
      examples:
        - "Your heading goes here"
    level:
      type: integer
      title: Heading level
      description: "HTML heading tag"
      default: 3
      examples:
        - 3
      enum: [1, 2, 3, 4, 5, 6]
    text_size:
      type: string
      title: Text size
      description: "Optional Bootstrap typography utility. Leave empty to match the selected heading level."
      enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - display-1
        - display-2
        - display-3
        - display-4
        - display-5
        - display-6
      'meta:enum':
        h1: "Heading size: H1"
        h2: "Heading size: H2"
        h3: "Heading size: H3"
        h4: "Heading size: H4"
        h5: "Heading size: H5"
        h6: "Heading size: H6"
        display-1: "Display 1"
        display-2: "Display 2"
        display-3: "Display 3"
        display-4: "Display 4"
        display-5: "Display 5"
        display-6: "Display 6"
    text_color:
      type: string
      title: Text color
      description: "Bootstrap text color utility. Leave empty for theme default."
      enum:
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-muted
        - text-white
        - text-dark
      'meta:enum':
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-muted: Muted
        text-white: White
        text-dark: Dark
    align:
      type: string
      title: Alignment
      description: "Bootstrap text alignment utility. Leave empty for default alignment."
      enum:
        - text-start
        - text-center
        - text-end
      'meta:enum':
        text-start: Start
        text-center: Center
        text-end: End
    font_weight:
      type: string
      title: Font weight
      description: "Bootstrap font weight utility. Leave empty for default weight."
      enum:
        - fw-light
        - fw-normal
        - fw-medium
        - fw-semibold
        - fw-bold
      'meta:enum':
        fw-light: Light
        fw-normal: Normal
        fw-medium: Medium
        fw-semibold: Semibold
        fw-bold: Bold
    font_style:
      type: string
      title: Font style
      description: "Bootstrap font style utility. Leave empty for default style."
      enum:
        - fst-italic
      'meta:enum':
        fst-italic: Italic
    url:
      type: string
      title: Link URL
      format: uri-reference
      description: "Optional. When provided, the heading text will be rendered as a link using the vartheme_bs5:link component."
      default: ""
    target:
      type: string
      title: Link target
      description: "Optional. Controls where the linked heading opens."
      default: "_self"
      examples:
        - "_self"
      enum:
        - _self
        - _blank
      'meta:enum':
        _self: "Same tab"
        _blank: "New tab"
