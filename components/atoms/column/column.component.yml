"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Column
group: Layout
status: stable
description: "Bootstrap column wrapper for Section grids. Ensures gutters (gx/gy) work."

props:
  type: object
  properties:
    extra_classes:
      type: string
      title: "Extra CSS classes"
      description: "Add Bootstrap col classes or utilities (space separated)."
      default: ""
      examples:
        - "col-md-6"
        - "col-lg-4"
        - "d-flex"

slots:
  content:
    title: Content
