$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Badge
group: Base
props:
  type: object
  required:
    - label
    - variant
  properties:
    label:
      type: string
      title: Label
      description: "Text shown inside the badge."
      examples:
        - "Badge"
    url:
      type: string
      title: Link (optional)
      format: uri-reference
      description: "If provided, badge will render as a link."
      default: ""
    variant:
      type: string
      title: Variant
      description: "Bootstrap contextual color utility for badges."
      enum:
        - "text-bg-primary"
        - "text-bg-secondary"
        - "text-bg-success"
        - "text-bg-danger"
        - "text-bg-warning"
        - "text-bg-info"
        - "text-bg-light"
        - "text-bg-dark"
      default: "text-bg-primary"
      'meta:enum':
        "text-bg-primary": "Primary"
        "text-bg-secondary": "Secondary"
        "text-bg-success": "Success"
        "text-bg-danger": "Danger"
        "text-bg-warning": "Warning"
        "text-bg-info": "Info"
        "text-bg-light": "Light"
        "text-bg-dark": "Dark"
      examples:
        - "text-bg-primary"
    size:
      type: string
      title: Size
      description: "Bootstrap utility classes for sizing (font-size + padding)."
      enum:
        - "fs-6 px-2 py-1"
        - "fs-6 px-3 py-2"
        - "fs-5 px-3 py-2"
      default: "fs-6 px-3 py-2"
      'meta:enum':
        "fs-6 px-2 py-1": "Small"
        "fs-6 px-3 py-2": "Medium (default)"
        "fs-5 px-3 py-2": "Large"
      examples:
        - "fs-6 px-3 py-2"
    icon:
      type: string
      title: Icon (optional)
      description: 'Optional Bootstrap Icon name (without the "bi-" prefix). Use "none" to disable.'
      enum:
        - "none"
        - "facebook"
        - "twitter-x"
        - "instagram"
        - "linkedin"
        - "x"
        - "plus"
        - "exclamation"
        - "check"
        - "dash"
        - "question"
        - "info"
        - "search"
        - "person"
        - "people"
        - "person-plus"
        - "person-check"
        - "chevron-up"
        - "chevron-down"
        - "chevron-left"
        - "chevron-right"
        - "chevron-double-up"
        - "chevron-double-down"
        - "chevron-double-left"
        - "chevron-double-right"
        - "arrow-up"
        - "arrow-down"
        - "arrow-left"
        - "arrow-right"
        - "arrow-up-right"
        - "arrow-up-left"
        - "arrow-down-right"
        - "arrow-down-left"
        - "arrow-repeat"
        - "arrows-angle-expand"
        - "arrows-angle-contract"
        - "play"
        - "pause"
        - "skip-backward"
        - "skip-forward"
        - "circle"
        - "circle-fill"
        - "record-circle"
      default: "none"
      examples:
        - "none"
      meta:enum:
        "none": "None"
        "facebook": "Facebook"
        "twitter-x": "Twitter X"
        "instagram": "Instagram"
        "linkedin": "LinkedIn"
        "x": "Close (X)"
        "plus": "Plus"
        "exclamation": "Exclamation"
        "check": "Check"
        "dash": "Dash"
        "question": "Question"
        "info": "Info"
        "search": "Search"
        "person": "Person"
        "people": "People"
        "person-plus": "Person Plus"
        "person-check": "Person Check"
        "chevron-up": "Chevron Up"
        "chevron-down": "Chevron Down"
        "chevron-left": "Chevron Left"
        "chevron-right": "Chevron Right"
        "chevron-double-up": "Chevron Double Up"
        "chevron-double-down": "Chevron Double Down"
        "chevron-double-left": "Chevron Double Left"
        "chevron-double-right": "Chevron Double Right"
        "arrow-up": "Arrow Up"
        "arrow-down": "Arrow Down"
        "arrow-left": "Arrow Left"
        "arrow-right": "Arrow Right"
        "arrow-up-right": "Arrow Up Right"
        "arrow-up-left": "Arrow Up Left"
        "arrow-down-right": "Arrow Down Right"
        "arrow-down-left": "Arrow Down Left"
        "arrow-repeat": "Arrow Repeat"
        "arrows-angle-expand": "Expand"
        "arrows-angle-contract": "Contract"
        "play": "Play"
        "pause": "Pause"
        "skip-backward": "Skip Backward"
        "skip-forward": "Skip Forward"
        "circle": "Circle"
        "circle-fill": "Circle Filled"
        "record-circle": "Record Circle"
    icon_first:
      type: boolean
      title: Icon position
      description: "If enabled, icon shows before the label. If disabled, icon shows after."
      default: true
      examples:
        - true
        - false
    radius:
      type: string
      title: Border radius
      description: "Bootstrap border-radius utility class."
      enum:
        - "rounded-1"
        - "rounded-pill"
      default: "rounded-1"
      'meta:enum':
        "rounded-1": "Rounded (default)"
        "rounded-pill": "Rounded pill"
      examples:
        - "rounded-1"
    indicator:
      type: string
      title: Notification indicator
      description: "Show a dot or a count bubble on the badge."
      enum:
        - "none"
        - "dot"
        - "count"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        "none": "None"
        "dot": "Dot"
        "count": "Count (e.g. 99+)"
    indicator_text:
      type: string
      title: Indicator count text
      description: "Text shown in count bubble (e.g. 1, 9, 99+). Used only when indicator=count."
      default: "99+"
      examples:
        - "99+"
