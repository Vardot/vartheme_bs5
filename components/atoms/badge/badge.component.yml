$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Badge
group: Base
status: stable

props:
  type: object
  required:
    - label
    - style
  properties:
    label:
      type: string
      title: Link text
      examples:
        - Badge text

    url:
      type: string
      title: Link

    style:
      type: string
      title: Style
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
      default: primary
      meta:enum:
        primary: Primary
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark
      examples:
        - primary

    icon:
      type: string
      title: Icon name
      description: 'The ID of an icon from the Phosphor Icons library.'
      examples:
        - rocket

    icon_first:
      type: boolean
      title: Icon first
      default: true
      examples:
        - true
        - false

    radius:
      type: string
      title: Border radius
      enum:
        - default
        - sm
        - lg
        - pill
        - none
      default: pill
      meta:enum:
        default: Default
        sm: Small
        lg: Large
        pill: Pill
        none: None
      examples:
        - pill

    badge_classes:
      type: string
      title: Extra CSS classes
      default: ""
      examples:
        - "fw-semibold"
