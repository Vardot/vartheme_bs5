$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Badge
group: Base
props:
  type: object
  required:
    - label
    - variant
  properties:
    label:
      type: string
      title: Label
      description: "Text shown inside the badge."
      examples:
        - "Badge"
    url:
      type: string
      title: Link (optional)
      format: uri-reference
      description: "If provided, badge will render as a link."
      default: ""
    variant:
      type: string
      title: Variant
      description: "Bootstrap contextual color utility for badges."
      enum:
        - "text-bg-primary"
        - "text-bg-secondary"
        - "text-bg-success"
        - "text-bg-danger"
        - "text-bg-warning"
        - "text-bg-info"
        - "text-bg-light"
        - "text-bg-dark"
      default: "text-bg-primary"
      'meta:enum':
        "text-bg-primary": "Primary"
        "text-bg-secondary": "Secondary"
        "text-bg-success": "Success"
        "text-bg-danger": "Danger"
        "text-bg-warning": "Warning"
        "text-bg-info": "Info"
        "text-bg-light": "Light"
        "text-bg-dark": "Dark"
      examples:
        - "text-bg-primary"
    size:
      type: string
      title: Size
      description: "Bootstrap utility classes for sizing (font-size + padding)."
      enum:
        - "fs-6 px-2 py-1"
        - "fs-6 px-3 py-2"
        - "fs-5 px-3 py-2"
      default: "fs-6 px-3 py-2"
      'meta:enum':
        "fs-6 px-2 py-1": "Small"
        "fs-6 px-3 py-2": "Medium (default)"
        "fs-5 px-3 py-2": "Large"
      examples:
        - "fs-6 px-3 py-2"
    icon:
      type: string
      title: Icon (optional)
      description: 'Optional Bootstrap Icon name (without the "bi-" prefix). Use "none" to disable.'
      default: "none"
      examples:
        - "none"
      x-canvas-icon: ['bootstrap_icons']
    icon_first:
      type: boolean
      title: Icon position
      description: "If enabled, icon shows before the label. If disabled, icon shows after."
      default: true
      examples:
        - true
        - false
    radius:
      type: string
      title: Border radius
      description: "Bootstrap border-radius utility class."
      enum:
        - "rounded-1"
        - "rounded-pill"
      default: "rounded-1"
      'meta:enum':
        "rounded-1": "Rounded (default)"
        "rounded-pill": "Rounded pill"
      examples:
        - "rounded-1"
    indicator:
      type: string
      title: Notification indicator
      description: "Show a dot or a count bubble on the badge."
      enum:
        - "none"
        - "dot"
        - "count"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        "none": "None"
        "dot": "Dot"
        "count": "Count (e.g. 99+)"
    indicator_text:
      type: string
      title: Indicator count text
      description: "Text shown in count bubble (e.g. 1, 9, 99+). Used only when indicator=count."
      default: "99+"
      examples:
        - "99+"
