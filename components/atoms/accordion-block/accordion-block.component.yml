$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: A single section of content that can be collapsed and expanded.
group: Layout

props:
  type: object
  properties:
    title:
      type: string
      title: Heading
      examples:
        - Section title

    heading_level:
      type: integer
      title: Heading level
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 3
      examples:
        - 3

    open_by_default:
      type: boolean
      title: Expanded by default
      default: true
      examples:
        - true

    parent_id:
      type: string
      title: Parent accordion id
      description: >-
        If set, the collapse element will be bound to this container (Bootstrap behavior).
        When empty, it tries to use a parent id from the surrounding Accordion container.
      default: ''

    item_id:
      type: string
      title: Item id
      description: >-
        Optional stable id suffix for this item (useful for toggling via links).
      default: ''

    always_open:
      type: boolean
      title: Always open
      description: Allow multiple items to remain open. Overrides parent binding.
      default: false

    extra_classes:
      type: string
      title: Extra classes
      description: Space separated classes (Bootstrap utilities allowed).
      default: ''

    color:
      type: string
      title: Header color
      description: Overrides container color for this item.
      enum:
        - inherit
        - default
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
      meta:
        enum:
          inherit: Inherit from container
          default: Default
          primary: Primary
          secondary: Secondary
          success: Success
          danger: Danger
          warning: Warning
          info: Info
          light: Light
          dark: Dark
      default: inherit

slots:
  accordion_content:
    title: Accordion content
    description: Content in this slot will be hidden when the accordion is collapsed.
    examples:
      - '<p>Accordion body content…</p>'

libraryOverrides:
  dependencies:
    - vartheme_bs5/bs-collapse-script
    - vartheme_bs5/accordion-styles
    - vartheme_bs5/framework
    - vartheme_bs5/accordion-scripts
