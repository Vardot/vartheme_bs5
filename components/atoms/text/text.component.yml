$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Text
group: Base
props:
  type: object
  properties:
    text:
      type: string
      title: Content (rich text)
      description: HTML content (e.g. Text). Make sure this content is filtered/safe before rendering.
      contentMediaType: text/html
      x-formatting-context: block
      default: <p>Lorem ipsum dolor sit amet.</p>
      examples:
        - <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    text_size:
      type: string
      title: Text size
      description: Bootstrap font-size utility class to apply.
      default: none
      enum:
        - none
        - fs-6
        - fs-5
        - fs-4
        - fs-3
      examples:
        - none
      meta:enum:
        none: None
        fs-6: Small
        fs-5: Medium
        fs-4: Large
        fs-3: Extra large
    text_color:
      type: string
      title: Text color
      description: Bootstrap text color utility class to apply.
      default: text-body
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-muted
        - text-dark
        - text-white
      examples:
        - text-body
      meta:enum:
        text-body: Default
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-muted: Muted
        text-dark: Dark
        text-white: White
    trim_length:
      type: number
      title: Trim length
      description: Number of characters or words to keep. Set 0 to disable trimming.
      default: 0
      examples:
        - 20
    trim_units:
      type: string
      title: Trim units
      description: Choose whether trim length applies to characters or words.
      default: characters
      enum:
        - characters
        - words
      examples:
        - characters
      meta:enum:
        characters: Characters
        words: Words
    suffix:
      type: string
      title: Suffix
      description: Text appended when the content is trimmed.
      default: '...'
      examples:
        - '...'
        - ' Read more'
    strip_html:
      type: boolean
      title: Strip HTML
      description: Remove HTML tags before trimming.
      default: false
      examples:
        - false
