$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Hero side by side
group: Hero
status: stable

props:
  type: object
  properties:
    id:
      type: string
      title: HTML ID (optional)
      examples:
        - "hero-intro"

    heading:
      type: string
      title: Heading
      examples:
        - "Build better digital experiences"

    heading_level:
      type: number
      title: Heading level
      enum: [1, 2, 3]
      default: 1
      examples: [1]
      meta:enum:
        1: H1
        2: H2
        3: H3

    text:
      type: string
      title: Description text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Create flexible, scalable Drupal experiences using modern components.</p>"

    image:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/image-placeholder.svg"
          alt: "Hero image"
          width: 1200
          height: 900

    image_position:
      type: string
      title: Image position
      enum: [right, left]
      default: right
      examples: [right]
      meta:enum:
        right: Image right
        left: Image left

    button_label:
      type: string
      title: Button label (optional)
      examples:
        - "Get started"

    button_url:
      type: string
      title: Button link (optional)

    button_target:
      type: string
      title: Button target
      enum: [self, blank]
      default: self
      examples: [self]
      meta:enum:
        self: Same tab
        blank: New tab

    align:
      type: string
      title: Content alignment
      enum: [start, center]
      default: start
      examples: [start]
      meta:enum:
        start: Left
        center: Center

    extra_classes:
      type: string
      title: Extra CSS classes (optional)
      examples:
        - "mb-5"
