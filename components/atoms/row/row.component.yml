"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Row
description: "Bootstrap .row wrapper with gutters, responsive row-cols presets, alignment controls, background utilities, and spacing utilities."
props:
  type: object
  properties:
    background_color:
      type: string
      title: "Background color"
      description: "Applies a Bootstrap background utility to the row wrapper."
      enum:
        - "none"
        - "bg-light"
        - "bg-body"
        - "bg-body-secondary"
        - "bg-body-tertiary"
        - "bg-primary"
        - "bg-secondary"
        - "bg-success"
        - "bg-danger"
        - "bg-warning"
        - "bg-info"
        - "bg-dark"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        none: "None"
        bg-light: "Light"
        bg-body: "Body"
        bg-body-secondary: "Body secondary"
        bg-body-tertiary: "Body tertiary"
        bg-primary: "Primary"
        bg-secondary: "Secondary"
        bg-success: "Success"
        bg-danger: "Danger"
        bg-warning: "Warning"
        bg-info: "Info"
        bg-dark: "Dark"
    bg_edge2edge:
      type: boolean
      title: "Background edge-to-edge"
      description: "Enable full-bleed background (adds bg-edge2edge class)."
      default: false
      examples:
        - false
    background_image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: "Background image (optional)"
      description: "Optional background image applied to the row wrapper. Leave empty for a solid background color."
    overlay_color:
      type: string
      title: "Background overlay color"
      description: "Color of the overlay on top of the background image."
      enum:
        - "none"
        - "dark"
        - "light"
      default: "dark"
      examples:
        - "dark"
      'meta:enum':
        none: "None"
        dark: "Dark"
        light: "Light"
    overlay_opacity:
      type: integer
      title: "Background overlay opacity"
      description: "Overlay opacity used with the background image."
      enum:
        - 0
        - 25
        - 50
        - 75
        - 100
      default: 50
      examples:
        - 50
      'meta:enum':
        0: "0%"
        25: "25%"
        50: "50%"
        75: "75%"
        100: "100%"  
    container_type:
      type: string
      title: "Container"
      description: "Optionally wrap the row inside a Bootstrap container."
      enum:
        - "none"
        - "container"
        - "container-fluid"
      default: "container"
      examples:
        - "container"
      'meta:enum':
        none: "No container"
        container: "Container"
        container-fluid: "Container fluid"
    gutter:
      type: string
      title: "Grid gap"
      description: "Space between columns using Bootstrap gutter utilities."
      enum:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
      default: "3"
      examples:
        - "3"
      'meta:enum':
        "0": "None"
        "1": "Small"
        "2": "Medium"
        "3": "Large"
        "4": "X-Large"
        "5": "XX-Large"
    columns_mobile:
      type: string
      title: "Columns on mobile"
      description: "How many columns per row on mobile (xs)."
      enum:
        - "none"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        none: "Use child widths"
        "1": "1 per row"
        "2": "2 per row"
        "3": "3 per row"
        "4": "4 per row"
        "5": "5 per row"
        "6": "6 per row"
    columns_desktop:
      type: string
      title: "Columns on desktop"
      description: "How many columns per row from md breakpoint and up."
      enum:
        - "none"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        none: "No desktop override"
        "1": "MD: 1 per row"
        "2": "MD: 2 per row"
        "3": "MD: 3 per row"
        "4": "MD: 4 per row"
        "5": "MD: 5 per row"
        "6": "MD: 6 per row"
    align_items:
      type: string
      title: "Vertical alignment"
      description: "Align columns vertically."
      enum:
        - "none"
        - "align-items-start"
        - "align-items-center"
        - "align-items-end"
        - "align-items-stretch"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        none: "Default"
        align-items-start: "Top"
        align-items-center: "Center"
        align-items-end: "Bottom"
        align-items-stretch: "Stretch"
    justify_content:
      type: string
      title: "Horizontal distribution"
      description: "Distribute columns across the row."
      enum:
        - "none"
        - "justify-content-start"
        - "justify-content-center"
        - "justify-content-end"
        - "justify-content-between"
        - "justify-content-around"
        - "justify-content-evenly"
      default: "none"
      examples:
        - "none"
      'meta:enum':
        none: "Default"
        justify-content-start: "Start"
        justify-content-center: "Center"
        justify-content-end: "End"
        justify-content-between: "Space between"
        justify-content-around: "Space around"
        justify-content-evenly: "Space evenly"
    padding_block_start:
      type: string
      title: "Padding top"
      description: "Top padding using Bootstrap spacing utilities."
      enum:
        - "pt-0"
        - "pt-1"
        - "pt-2"
        - "pt-3"
        - "pt-4"
        - "pt-5"
      default: "pt-0"
      examples:
        - "pt-0"
      'meta:enum':
        pt-0: "None"
        pt-1: "Small"
        pt-2: "Medium"
        pt-3: "Large"
        pt-4: "X-Large"
        pt-5: "XX-Large"
    padding_block_end:
      type: string
      title: "Padding bottom"
      description: "Bottom padding using Bootstrap spacing utilities."
      enum:
        - "pb-0"
        - "pb-1"
        - "pb-2"
        - "pb-3"
        - "pb-4"
        - "pb-5"
      default: "pb-0"
      examples:
        - "pb-0"
      'meta:enum':
        pb-0: "None"
        pb-1: "Small"
        pb-2: "Medium"
        pb-3: "Large"
        pb-4: "X-Large"
        pb-5: "XX-Large"
    margin_block_start:
      type: string
      title: "Margin top"
      description: "Top margin using Bootstrap spacing utilities."
      enum:
        - "mt-0"
        - "mt-1"
        - "mt-2"
        - "mt-3"
        - "mt-4"
        - "mt-5"
      default: "mt-0"
      examples:
        - "mt-0"
      'meta:enum':
        mt-0: "None"
        mt-1: "Small"
        mt-2: "Medium"
        mt-3: "Large"
        mt-4: "X-Large"
        mt-5: "XX-Large"
    margin_block_end:
      type: string
      title: "Margin bottom"
      description: "Bottom margin using Bootstrap spacing utilities."
      enum:
        - "mb-0"
        - "mb-1"
        - "mb-2"
        - "mb-3"
        - "mb-4"
        - "mb-5"
      default: "mb-0"
      examples:
        - "mb-0"
      'meta:enum':
        mb-0: "None"
        mb-1: "Small"
        mb-2: "Medium"
        mb-3: "Large"
        mb-4: "X-Large"
        mb-5: "XX-Large"
slots:
  content:
    title: "Columns"
