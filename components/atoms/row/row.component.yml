"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Row
group: Layout
status: stable
description: "Bootstrap .row wrapper with gutters, optional responsive row-cols presets, and alignment controls."

props:
  type: object
  properties:
    container_type:
      type: string
      title: "Container"
      description: "Optionally wrap the row inside a Bootstrap container."
      enum:
        - "none"
        - "container"
        - "container-fluid"
        - "container-sm"
        - "container-md"
        - "container-lg"
        - "container-xl"
        - "container-xxl"
      default: "none"
      'meta:enum':
        none: "No container"
        container: "Container (default)"
        container-fluid: "Full width (fluid)"
        container-sm: "Container (SM)"
        container-md: "Container (MD)"
        container-lg: "Container (LG)"
        container-xl: "Container (XL)"
        container-xxl: "Container (XXL)"

    gutter:
      type: string
      title: "Grid gap"
      description: "Space between columns (Bootstrap gutters)."
      enum: ["0", "1", "2", "3", "4", "5"]
      default: "3"
      'meta:enum':
        "0": "None"
        "1": "Small"
        "2": "Medium"
        "3": "Large (recommended)"
        "4": "Extra large"
        "5": "XX-Large"

    columns_mobile:
      type: string
      title: "Columns on mobile"
      description: "How many columns per row on mobile (xs)."
      enum: ["none", "1", "2", "3", "4", "5", "6"]
      default: "none"
      'meta:enum':
        none: "Use child widths (default)"
        "1": "1 per row"
        "2": "2 per row"
        "3": "3 per row"
        "4": "4 per row"
        "5": "5 per row"
        "6": "6 per row"

    columns_desktop:
      type: string
      title: "Columns on desktop"
      description: "How many columns per row from md breakpoint and up."
      enum: ["none", "1", "2", "3", "4", "5", "6"]
      default: "none"
      'meta:enum':
        none: "No desktop override"
        "1": "MD: 1 per row"
        "2": "MD: 2 per row"
        "3": "MD: 3 per row"
        "4": "MD: 4 per row"
        "5": "MD: 5 per row"
        "6": "MD: 6 per row"

    align_items:
      type: string
      title: "Vertical alignment"
      description: "Align columns vertically."
      enum:
        - "none"
        - "align-items-start"
        - "align-items-center"
        - "align-items-end"
        - "align-items-stretch"
      default: "none"
      'meta:enum':
        none: "Default"
        align-items-start: "Top"
        align-items-center: "Center"
        align-items-end: "Bottom"
        align-items-stretch: "Stretch"

    justify_content:
      type: string
      title: "Horizontal distribution"
      description: "Distribute columns across the row."
      enum:
        - "none"
        - "justify-content-start"
        - "justify-content-center"
        - "justify-content-end"
        - "justify-content-between"
        - "justify-content-around"
        - "justify-content-evenly"
      default: "none"
      'meta:enum':
        none: "Default"
        justify-content-start: "Start"
        justify-content-center: "Center"
        justify-content-end: "End"
        justify-content-between: "Space between"
        justify-content-around: "Space around"
        justify-content-evenly: "Space evenly"
    bg_edge2edge:
      type: boolean
      title: "Background edge-to-edge"
      description: "If enabled, adds the class bg-edge2edge (for full-bleed backgrounds)."
      default: false

    background_color:
      type: string
      title: "Background color"
      description: "Applies a Bootstrap background utility to the row wrapper."
      enum: ["none","white","light","dark","primary","secondary","success","danger","warning","info"]
      default: "white"
      'meta:enum':
        none: "None"
        white: "White"
        light: "Light"
        dark: "Dark"
        primary: "Primary"
        secondary: "Secondary"
        success: "Success"
        danger: "Danger"
        warning: "Warning"
        info: "Info"

    background_image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: "Background image (optional)"
      description: "Optional background image applied to the row wrapper. Leave empty for a solid background color."

    overlay_color:
      type: string
      title: "Background overlay color"
      description: "Color of the overlay on top of the background image."
      enum: ["none","dark","light"]
      default: "dark"
      'meta:enum':
        none: "None"
        dark: "Dark"
        light: "Light"

    overlay_opacity:
      type: integer
      title: "Background overlay opacity"
      description: "Overlay opacity using Bootstrap opacity utilities."
      enum: [0,25,50,75,100]
      default: 50
      'meta:enum':
        0: "0% (transparent)"
        25: "25%"
        50: "50% (recommended)"
        75: "75%"
        100: "100% (solid)"

    vertical_padding:
      type: string
      title: "Vertical padding"
      description: "Top & bottom spacing using Bootstrap utilities."
      enum: ["py-0","py-3","py-4","py-5"]
      default: "py-4"
      'meta:enum':
        py-0: "None"
        py-3: "Small"
        py-4: "Medium (recommended)"
        py-5: "Large"

    html_id:
      type: string
      title: "HTML ID"
      description: "Optional ID for the row."
      default: ""

    extra_classes:
      type: string
      title: "Extra CSS classes"
      description: "Add custom classes (space separated)."
      default: ""

slots:
  content:
    title: "Columns"
