$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Blockquote
group: Base
props:
  type: object
  required:
    - text
  properties:
    type:
      type: string
      title: Type
      description: Color style of the blockquote.
      enum:
        - dark
        - light
      default: dark
      examples:
        - dark
      meta:enum:
        dark: Dark
        light: Light
    text:
      type: string
      title: Quote text
      description: The main content of the blockquote. Make sure this content is filtered/safe before rendering.
      pattern: "(.|\\r?\\n)*"
      examples:
        - Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc non sapien lacinia, pellentesque elit sit amet, tempor orci.
    cite_text:
      type: string
      title: Quotee Name and Position
      description: Name and Role, organization, or source of the quote.
      examples:
        - Quotee Name and Position

