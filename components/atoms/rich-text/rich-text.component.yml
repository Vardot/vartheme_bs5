$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Rich Text
group: Base
props:
  type: object
  properties:
    text:
      type: string
      title: Content (rich text)
      description: HTML content (e.g. Text). Make sure this content is filtered/safe before rendering.
      contentMediaType: text/html
      x-formatting-context: block
      default: <p>Lorem ipsum dolor sit amet.</p>
      examples:
        - <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    trim_length:
      type: integer
      title: Trim length
      description: Number of characters or words to keep. Set 0 to disable trimming.
      default: 0
      minimum: 0
      examples:
        - 120
    trim_units:
      type: string
      title: Trim units
      description: Choose whether trim length is measured in characters or words.
      default: characters
      enum:
        - characters
        - words
      examples:
        - characters
    suffix:
      type: string
      title: Suffix
      description: Text appended when content is trimmed.
      default: '...'
      examples:
        - '...'
        - ' Read more'
    strip_html:
      type: boolean
      title: Strip HTML
      description: Remove HTML tags before trimming and output.
      default: false
      examples:
        - false
