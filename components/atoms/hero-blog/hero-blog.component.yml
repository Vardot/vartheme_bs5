"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Hero Blog
description: "Blog hero with published date, title, author, and optional media."
group: Hero
status: stable

props:
  type: object
  properties:

    heading_text:
      type: string
      title: "Title"
      default: "Enter the title"
      examples:
        - "Vivamus curae metus neque mollis orci ipsum sapien velit cursus"

    level:
      type: integer
      title: "Heading level"
      enum: [1, 2, 3, 4, 5, 6]
      default: 1
      examples:
        - 1
      'meta:enum':
        1: "H1"
        2: "H2"
        3: "H3"
        4: "H4"
        5: "H5"
        6: "H6"

    heading_size:
      type: string
      title: "Heading size"
      description: "Visual size (Bootstrap heading/display classes)."
      enum:
        - default
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - display-1
        - display-2
        - display-3
        - display-4
        - display-5
        - display-6
      default: display-4
      'meta:enum':
        default: "Default (inherit)"
        h1: "Heading 1 (h1)"
        h2: "Heading 2 (h2)"
        h3: "Heading 3 (h3)"
        h4: "Heading 4 (h4)"
        h5: "Heading 5 (h5)"
        h6: "Heading 6 (h6)"
        display-1: "Display 1 (largest)"
        display-2: "Display 2"
        display-3: "Display 3"
        display-4: "Display 4"
        display-5: "Display 5"
        display-6: "Display 6 (smallest)"

    date:
      type: integer
      title: "Published date (Unix timestamp)"
      description: "Unix timestamp (seconds). Leave empty to hide."
      # Example: 2026-02-12
      default: 1770856866
      examples:
        - 1770856866

    author:
      type: string
      title: "Author name"
      default: ""
      examples:
        - "John Smith"

    author_url:
      type: string
      title: "Author link"
      description: "Optional URL for the author name."
      default: ""
      examples:
        - "https://example.com/author/john-smith"

    container_width:
      type: string
      title: "Container width"
      enum:
        - container
        - container-sm
        - container-md
        - container-lg
        - container-xl
        - container-xxl
      default: container
      'meta:enum':
        container: "Default container"
        container-sm: "Small container"
        container-md: "Medium container"
        container-lg: "Large container"
        container-xl: "Extra large container"
        container-xxl: "2XL container"
    
    html_id:
      type: string
      title: "HTML ID"
      description: "Optional ID attribute for the outer section."
      default: ""
      examples:
        - "blog-hero"

    extra_classes:
      type: string
      title: "Extra classes"
      description: "Space separated classes (Bootstrap utilities allowed)."
      default: ""

    media:
      $ref: json-schema-definitions://canvas.module/image
      title: "Image (optional)"
      type: object
      examples:
        - src: "assets/boliviainteligente-I1rJ9ViO3ik-unsplash.jpg"
          alt: "Placeholder image"

slots:
  blog_media:
    title: "Media"
