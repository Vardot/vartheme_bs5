"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Bootstrap Icon
noUi: true
props:
  type: object
  properties:
    icon:
      type: string
      title: Icon name
      description: "Select a Bootstrap icon name."
      default: "award"
      examples:
        - "award"
      x-canvas-icon: ['bootstrap_icons']
    icon_size:
      type: [string, number]
      title: Icon size
      description: "Controls the icon size using Bootstrap font-size utility classes."
      enum:
        - fs-6
        - fs-5
        - fs-4
        - fs-3
        - fs-2
        - fs-1
      default: fs-4
      examples:
        - fs-4
      meta:enum:
        fs-6: Extra small
        fs-5: Small
        fs-4: Medium
        fs-3: Large
        fs-2: Extra large
        fs-1: Huge
    color:
      type: string
      title: Color
      description: "Bootstrap text color utility class name."
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-light
        - text-dark
        - text-muted
        - text-white
      default: text-body
      examples:
        - text-body
      meta:enum:
        text-body: Default
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-muted: Muted
        text-white: White
