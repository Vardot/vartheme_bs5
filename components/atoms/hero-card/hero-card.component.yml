$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero Card
group: Hero
status: stable
description: >
  Flexible hero card (overlay/split/stacked/content-media) with Bootstrap 5 utilities.
  Canvas-friendly controls for title, text, media, layout, and buttons.
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      default: "Demo title"
    heading_tag:
      type: string
      title: Heading tag
      enum: [h2, h3, h4, h5, h6]
      default: h2
      meta:enum:
        h2: H2
        h3: H3
        h4: H4
        h5: H5
        h6: H6
    content_text:
      type: string
      title: Content (rich text)
      description: "HTML content (e.g. Text). Make sure this content is filtered/safe before rendering."
      contentMediaType: text/html
      x-formatting-context: block
      default: "<p>Elevate your digital experience with Varbase's dynamic design system, seamlessly blending aesthetic appeal with unparalleled functionality. Unleash the power of intuitive design for a compelling web presence.</p>"
      examples:
        - "<p>Elevate your digital experience with Varbase's dynamic design system, seamlessly blending aesthetic appeal with unparalleled functionality. Unleash the power of intuitive design for a compelling web presence.</p>"
    # Canvas image schema (reliable uploader)
    media:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Media image
      examples:
        - src: assets/hero-card-image-placeholder.svg
          alt: Placeholder image
          width: 1200
          height: 800
    object_position:
      type: string
      title: Media focal position
      enum: [top, center, bottom]
      default: center
      meta:enum:
        top: Top
        center: Center
        bottom: Bottom
    overlay_image_mode:
      type: string
      title: Image fit
      enum: [object-fit-cover, object-fit-contain]
      default: object-fit-cover
      meta:enum:
        object-fit-cover: Fill area and crop
        object-fit-contain: Fit entire image
    overlay_bg:
      type: string
      title: Overlay color
      enum:
        - bg-dark
        - bg-black
        - bg-white
        - bg-primary
        - bg-secondary
        - bg-success
        - bg-danger
        - bg-warning
        - bg-info
      default: bg-dark
      meta:enum:
        bg-dark: Dark
        bg-black: Black
        bg-white: White
        bg-primary: Primary
        bg-secondary: Secondary
        bg-success: Success
        bg-danger: Danger
        bg-warning: Warning
        bg-info: Info
    overlay_opacity:
      type: string
      title: Overlay opacity
      enum: [opacity-10, opacity-25, opacity-50, opacity-75, opacity-100]
      default: opacity-50
      meta:enum:
        opacity-10: 10%
        opacity-25: 25%
        opacity-50: 50%
        opacity-75: 75%
        opacity-100: 100%
    container_type:
      type: string
      title: Container width
      enum: [container, container-fluid, none]
      default: container
      meta:enum:
        container: Standard container
        container-fluid: Full width container
        none: No container wrapper
    bg_edge2edge:
      type: boolean
      title: Edge-to-edge background
      default: false
    media_position:
      type: string
      title: Media position
      enum: [overlay, start, end, top, bottom, content, none]
      default: end
      meta:enum:
        overlay: Background overlay
        start: Start side
        end: End side
        top: Above content
        bottom: Below content
        content: Inside content area
        none: No media
    split_gap:
      type: string
      title: Grid gap (split layout)
      enum: [g-0, g-2, g-4, g-5]
      default: g-4
      meta:enum:
        g-0: No gap
        g-2: Small gap
        g-4: Medium gap
        g-5: Large gap
    card_border:
      type: boolean
      title: Card border
      default: false
    padding:
      type: boolean
      title: Add padding
      default: false
    horizontal_alignment:
      type: string
      title: Horizontal alignment
      enum: [text-start, text-center, text-end]
      default: text-start
      meta:enum:
        text-start: Align text left
        text-center: Align text center
        text-end: Align text right
    vertical_alignment:
      type: string
      title: Vertical alignment
      enum: [justify-content-start, justify-content-center, justify-content-end]
      default: justify-content-center
      meta:enum:
        justify-content-start: Align content top
        justify-content-center: Align content middle
        justify-content-end: Align content bottom
    # ✅ Background color dropdown (Canvas shows options now)
    background_color:
      type: string
      title: Background color
      enum:
        - bg-transparent
        - bg-white
        - bg-light
        - bg-dark
        - bg-primary
        - bg-secondary
        - bg-success
        - bg-danger
        - bg-warning
        - bg-info
      default: bg-transparent
      meta:enum:
        bg-transparent: Transparent
        bg-white: White
        bg-light: Light
        bg-dark: Dark
        bg-primary: Primary
        bg-secondary: Secondary
        bg-success: Success
        bg-danger: Danger
        bg-warning: Warning
        bg-info: Info
    # (Optional but useful) content text color dropdown
    content_color:
      type: string
      title: Content text color
      enum: [text-dark, text-white]
      default: text-dark
      meta:enum:
        text-dark: Dark text
        text-white: White text
    # ✅ Overlay color dropdown too
    button_1_label:
      type: string
      title: Button label
      default: "Learn more"
    button_1_url:
      type: string
      title: Button URL
      default: "#"
    button_1_style:
      type: string
      title: Button style
      enum:
        - btn-primary
        - btn-secondary
        - btn-success
        - btn-danger
        - btn-warning
        - btn-info
        - btn-light
        - btn-dark
        - btn-outline-primary
        - btn-outline-secondary
        - btn-outline-success
        - btn-outline-danger
        - btn-outline-warning
        - btn-outline-info
        - btn-outline-light
        - btn-outline-dark
        - btn-link
      default: btn-primary
      meta:enum:
        btn-primary: Primary
        btn-secondary: Secondary
        btn-success: Success
        btn-danger: Danger
        btn-warning: Warning
        btn-info: Info
        btn-light: Light
        btn-dark: Dark
        btn-outline-primary: Outline primary
        btn-outline-secondary: Outline secondary
        btn-outline-success: Outline success
        btn-outline-danger: Outline danger
        btn-outline-warning: Outline warning
        btn-outline-info: Outline info
        btn-outline-light: Outline light
        btn-outline-dark: Outline dark
        btn-link: Link
    button_1_size:
      type: string
      title: Button size
      enum: [default, btn-sm, btn-lg]
      default: default
      meta:enum:
        default: Default size
        btn-sm: Small button
        btn-lg: Large button
    button_1_target:
      type: string
      title: Button target
      enum: [default, _self, _blank]
      default: default
      meta:enum:
        default: Same tab
        _self: Same tab (forced)
        _blank: New tab
slots:
  media_slot:
    title: Card media (slot)
    description: Optional override for media (e.g. video).
  actions:
    title: Actions (slot)
    description: Optional override for buttons rendering.
