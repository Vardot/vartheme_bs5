"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Card
group: Card
props:
  type: object
  required:
    - heading_text
    - orientation
    - style
  properties:
    id:
      type: string
      title: HTML ID
      default: ""
    extra_classes:
      type: string
      title: Extra classes
      description: "Space separated classes (Bootstrap utilities allowed)."
      default: ""
    shadow:
      type: string
      title: Shadow
      enum: [none, sm, default, lg]
      meta:
        enum:
          none: None
          sm: Small
          default: Default
          lg: Large
      default: default
    border:
      type: string
      title: Border
      enum: [default, none, primary, secondary, success, danger, warning, info, light, dark]
      meta:
        enum:
          default: Default
          none: None
          primary: Primary
          secondary: Secondary
          success: Success
          danger: Danger
          warning: Warning
          info: Info
          light: Light
          dark: Dark
      default: default
    rounded:
      type: string
      title: Rounded
      # Note: keep enum values as strings because prop type is string.
      enum: [default, "0", "1", "2", "3", pill]
      meta:
        enum:
          default: Default
          "0": None
          "1": Small
          "2": Medium
          "3": Large
          pill: Pill
      default: default
    background:
      type: string
      title: Background
      enum:
        - default
        - accent
        - primary
        - inverted
      meta:
        enum:
          default: Secondary
          accent: Accent
          primary: Primary
          inverted: Inverted
      default: default
      examples:
        - default
    style:
      type: string
      title: Style
      enum:
        - framed
        - full
      meta:
        enum:
          framed: Framed
          full: Full width
      default: framed
      examples:
        - framed
    orientation:
      type: string
      title: Orientation
      enum:
        - vertical
        - horizontal
      meta:
        enum:
          vertical: Vertical
          horizontal: Horizontal
      default: vertical
      examples:
        - vertical
    heading_text:
      type: string
      title: Heading
      default: "This is your card title"
      examples:
        - "This is your card title"
    level:
      type: number
      title: Heading level
      enum:
        - 2
        - 3
        - 4
      default: 3
      examples:
        - 3
    url:
      type: string
      title: Link
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/jj-ying-8bghKxNU1j0-unsplash.jpg"
          width: 1200
          height: 900
          alt: "Photo by jjying: https://unsplash.com/photos/purple-and-blue-light-digital-wallpaper-8bghKxNU1j0"
    text:
      type: string
      title: Description
      pattern: "(.|\\r?\\n)*"
      examples:
        - "Quaerat laborum rerum dolores dolores dolor qui."
    is_text_centered:
      type: boolean
      title: Center text
      examples:
        - false
    button_label:
      type: string
      title: Button label
      description: "Optional CTA button label (shows when url is provided)."
      default: ""
    button_variant:
      type: string
      title: Button variant
      enum: [primary, secondary, success, danger, warning, info, light, dark, link]
      meta:
        enum:
          primary: Primary
          secondary: Secondary
          success: Success
          danger: Danger
          warning: Warning
          info: Info
          light: Light
          dark: Dark
          link: Link
      default: primary
