"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Card
group: Card
status: stable

props:
  type: object
  required:
    - heading_text
    - orientation
    - style
  properties:
    shadow:
      type: string
      title: Shadow
      description: Adds depth to the card.
      enum: [none, sm, default, lg]
      default: default
      examples: [default]
      meta:enum:
        none: No shadow
        sm: Small shadow
        default: Default shadow
        lg: Large shadow

    border:
      type: string
      title: Border style
      description: Adds a border (or removes it).
      enum: [default, none, primary, secondary, success, danger, warning, info, light, dark]
      default: default
      examples: [default]
      meta:enum:
        default: Default
        none: No border
        primary: Primary
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark

    rounded:
      type: string
      title: Corner style
      description: Controls how rounded the card corners are.
      # Keep enum values as strings because prop type is string.
      enum: [default, "0", "1", "2", "3", pill]
      default: default
      examples: [default]
      meta:enum:
        default: Default
        "0": Square corners
        "1": Slightly rounded
        "2": Rounded
        "3": More rounded
        pill: Fully rounded (pill)

    background:
      type: string
      title: Background theme
      description: Background color style for the card.
      enum: [default, accent, primary, inverted]
      default: default
      examples: [default]
      meta:enum:
        default: Default
        accent: Light background
        primary: Primary background
        inverted: Dark background

    style:
      type: string
      title: Padding style
      description: Controls padding inside the card.
      enum: [framed, full]
      default: framed
      examples: [framed]
      meta:enum:
        framed: Normal padding
        full: Larger padding

    orientation:
      type: string
      title: Layout
      description: Controls how image and content are arranged.
      enum: [vertical, horizontal]
      default: vertical
      examples: [vertical]
      meta:enum:
        vertical: Image on top
        horizontal: Image on left

    media_ratio:
      type: string
      title: Image size (vertical)
      description: Controls the image height for vertical cards (prevents very tall images).
      enum: [auto, "16x9", "4x3", "1x1"]
      default: "16x9"
      examples: ["16x9"]
      meta:enum:
        auto: Auto (no fixed ratio)
        "16x9": Wide (16:9)
        "4x3": Standard (4:3)
        "1x1": Square (1:1)

    heading_text:
      type: string
      title: Heading
      default: "This is your card title"
      examples:
        - "This is your card title"

    level:
      type: number
      title: Heading level
      description: HTML heading level for the card title.
      enum: [2, 3, 4]
      default: 3
      examples: [3]
      meta:enum:
        2: H2
        3: H3
        4: H4

    url:
      type: string
      title: Link URL (optional)
      description: If provided, the whole card can link (or show a button if label is set).

    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/card-placeholder.svg"
          width: 1200
          height: 900
          alt: "Placeholder card image"

    text:
      type: string
      title: Description
      description: Short supporting text under the heading.
      pattern: "(.|\\r?\\n)*"
      examples:
        - "A short description goes here."

    is_text_centered:
      type: boolean
      title: Center text
      description: Centers the text content inside the card body.
      examples: [false]

    button_label:
      type: string
      title: Button label (optional)
      description: If set and Link URL is provided, shows a button instead of linking the entire card.
      default: ""
      examples:
        - "Learn more"

    button_variant:
      type: string
      title: Button style
      description: Style for the optional button.
      enum: [primary, secondary, success, danger, warning, info, light, dark, link]
      default: primary
      examples: [primary]
      meta:enum:
        primary: Primary
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark
        link: Link style

    id:
      type: string
      title: HTML ID (optional)
      description: Optional ID attribute for linking.
      default: ""
      examples:
        - "feature-card"

    extra_classes:
      type: string
      title: Extra CSS classes (optional)
      description: Space separated classes (Bootstrap utilities allowed).
      default: ""
      examples:
        - "mb-4"
