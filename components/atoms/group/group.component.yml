"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Group
group: Layout
description: "Bootstrap flex group for stacking items (horizontal/vertical) with gap, alignment, spacing, and background utilities."

props:
  type: object
  properties:

    background_color:
      type: string
      title: "Background color"
      description: "Bootstrap background utility class."
      enum:
        - "none"
        - "bg-primary"
        - "bg-secondary"
        - "bg-success"
        - "bg-danger"
        - "bg-warning"
        - "bg-info"
        - "bg-light"
        - "bg-dark"
        - "bg-body"
        - "bg-body-secondary"
        - "bg-body-tertiary"
      default: "none"
      meta:enum:
        none: "None"
        bg-primary: "Primary"
        bg-secondary: "Secondary"
        bg-success: "Success"
        bg-danger: "Danger"
        bg-warning: "Warning"
        bg-info: "Info"
        bg-light: "Light"
        bg-dark: "Dark"
        bg-body: "Body"
        bg-body-secondary: "Body secondary"
        bg-body-tertiary: "Body tertiary"

    direction:
      type: string
      title: "Direction"
      description: "How items should flow."
      enum:
        - "vertical"
        - "horizontal"
      default: "vertical"
      meta:enum:
        vertical: "Vertical (stack)"
        horizontal: "Horizontal (row)"

    gap:
      type: string
      title: "Space between items"
      description: "Bootstrap gap utility."
      enum:
        - "gap-0"
        - "gap-1"
        - "gap-2"
        - "gap-3"
        - "gap-4"
        - "gap-5"
      default: "gap-3"
      meta:enum:
        gap-0: "None"
        gap-1: "Small"
        gap-2: "Medium"
        gap-3: "Large"
        gap-4: "X-Large"
        gap-5: "XX-Large"

    wrap:
      type: string
      title: "Wrap items (horizontal only)"
      description: "If horizontal, allow items to wrap onto new lines."
      enum:
        - "wrap"
        - "nowrap"
        - "wrap-reverse"
      default: "wrap"
      meta:enum:
        wrap: "Wrap"
        nowrap: "No wrap"
        wrap-reverse: "Wrap (reverse)"

    align_items:
      type: string
      title: "Vertical alignment"
      description: "Align items on the cross axis."
      enum:
        - "align-items-start"
        - "align-items-center"
        - "align-items-end"
        - "align-items-stretch"
        - "align-items-baseline"
      default: "align-items-stretch"
      meta:enum:
        align-items-start: "Top"
        align-items-center: "Center"
        align-items-end: "Bottom"
        align-items-stretch: "Stretch"
        align-items-baseline: "Baseline"

    justify_content:
      type: string
      title: "Horizontal distribution"
      description: "Distribute items along the main axis."
      enum:
        - "justify-content-start"
        - "justify-content-center"
        - "justify-content-end"
        - "justify-content-between"
        - "justify-content-around"
        - "justify-content-evenly"
      default: "justify-content-start"
      meta:enum:
        justify-content-start: "Start"
        justify-content-center: "Center"
        justify-content-end: "End"
        justify-content-between: "Space between"
        justify-content-around: "Space around"
        justify-content-evenly: "Space evenly"

    padding_block_start:
      type: string
      title: "Padding top"
      description: "Bootstrap padding-top utility class."
      enum:
        - "pt-0"
        - "pt-1"
        - "pt-2"
        - "pt-3"
        - "pt-4"
        - "pt-5"
      default: "pt-0"
      meta:enum:
        pt-0: "None"
        pt-1: "Small"
        pt-2: "Medium"
        pt-3: "Large"
        pt-4: "X-Large"
        pt-5: "XX-Large"

    padding_block_end:
      type: string
      title: "Padding bottom"
      description: "Bootstrap padding-bottom utility class."
      enum:
        - "pb-0"
        - "pb-1"
        - "pb-2"
        - "pb-3"
        - "pb-4"
        - "pb-5"
      default: "pb-0"
      meta:enum:
        pb-0: "None"
        pb-1: "Small"
        pb-2: "Medium"
        pb-3: "Large"
        pb-4: "X-Large"
        pb-5: "XX-Large"

    margin_block_start:
      type: string
      title: "Margin top"
      description: "Bootstrap margin-top utility class."
      enum:
        - "mt-0"
        - "mt-1"
        - "mt-2"
        - "mt-3"
        - "mt-4"
        - "mt-5"
      default: "mt-0"
      meta:enum:
        mt-0: "None"
        mt-1: "Small"
        mt-2: "Medium"
        mt-3: "Large"
        mt-4: "X-Large"
        mt-5: "XX-Large"

    margin_block_end:
      type: string
      title: "Margin bottom"
      description: "Bootstrap margin-bottom utility class."
      enum:
        - "mb-0"
        - "mb-1"
        - "mb-2"
        - "mb-3"
        - "mb-4"
        - "mb-5"
      default: "mb-0"
      meta:enum:
        mb-0: "None"
        mb-1: "Small"
        mb-2: "Medium"
        mb-3: "Large"
        mb-4: "X-Large"
        mb-5: "XX-Large"

slots:
  content:
    title: "Content"
