$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Video
group: Base

props:
  type: object
  properties:
    video_file:
      $ref: json-schema-definitions://canvas.module/video
      title: Video (upload/select)
      description: Upload or select a video from the Media Library.

    ratio:
      type: string
      title: Aspect ratio
      description: Responsive ratio wrapper for the video.
      enum: ["16x9", "4x3", "1x1", "21x9"]
      default: "16x9"
      examples:
        - "16x9"
      meta:enum:
        "16x9": 16:9 (Wide)
        "4x3": 4:3 (Standard)
        "1x1": 1:1 (Square)
        "21x9": 21:9 (Ultra-wide)

    loading:
      type: string
      title: Loading
      enum: [lazy, eager]
      default: lazy
      examples:
        - lazy
      meta:enum:
        lazy: Lazy
        eager: Eager

    extra_classes:
      type: string
      title: Extra classes (optional)
      description: Space-separated Bootstrap utility classes.
      default: ""

