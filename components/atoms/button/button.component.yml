$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
group: Base
props:
  type: object
  required:
    - variant
    - size
  properties:
    variant:
      type: string
      title: Variant
      description: Bootstrap button style class.
      enum:
        - btn-primary
        - btn-secondary
        - btn-success
        - btn-danger
        - btn-warning
        - btn-info
        - btn-light
        - btn-dark
        - btn-link
      default: btn-primary
      examples:
        - btn-primary
      meta:enum:
        btn-primary: Primary
        btn-secondary: Secondary
        btn-success: Success
        btn-danger: Danger
        btn-warning: Warning
        btn-info: Info
        btn-light: Light
        btn-dark: Dark
        btn-link: Link
    outline:
      type: boolean
      title: Outline
      description: When enabled, uses the Bootstrap outline button style (btn-outline-*) for the selected variant (not applied
        to btn-link).
      default: false
      examples:
        - false
    size:
      type: string
      title: Size
      description: Bootstrap button size class.
      enum:
        - btn-md
        - btn-sm
        - btn-lg
      default: btn-md
      examples:
        - btn-md
      meta:enum:
        btn-md: Medium (default)
        btn-sm: Small
        btn-lg: Large
    label:
      type: string
      title: Label
      default: Button label
      examples:
        - Read more
      description: Button text.
    href:
      type: string
      title: Link URL (optional)
      format: uri-reference
      description: If provided, renders as a link (<a>) instead of a <button>.
    target:
      type: string
      title: Link target
      description: Where to open the link (used only when Link URL is provided).
      enum:
        - self
        - blank
      default: self
      examples:
        - self
      meta:enum:
        self: Same tab (default)
        blank: New tab
    disabled:
      type: boolean
      title: Disabled
      default: false
      examples:
        - false
    icon:
      type: string
      title: Icon (optional)
      description: Optional Bootstrap Icon name (without the "bi-" prefix). Use "none" to disable.
      enum:
        - none
        - facebook
        - twitter-x
        - instagram
        - linkedin
        - x
        - plus
        - exclamation
        - check
        - dash
        - question
        - info
        - search
        - person
        - people
        - person-plus
        - person-check
        - chevron-up
        - chevron-down
        - chevron-left
        - chevron-right
        - chevron-double-up
        - chevron-double-down
        - chevron-double-left
        - chevron-double-right
        - arrow-up
        - arrow-down
        - arrow-left
        - arrow-right
        - arrow-up-right
        - arrow-up-left
        - arrow-down-right
        - arrow-down-left
        - arrow-repeat
        - arrows-angle-expand
        - arrows-angle-contract
        - play
        - pause
        - skip-backward
        - skip-forward
        - circle
        - circle-fill
        - record-circle
        - arrow-right-circle-fill
        - arrow-left-circle-fill
        - arrow-up-circle-fill
        - arrow-down-circle-fill
        - caret-right-fill
        - caret-left-fill
        - caret-up-fill
        - caret-down-fill
      default: none
      examples:
        - none
      meta:enum:
        none: None
        facebook: Facebook
        twitter-x: Twitter X
        instagram: Instagram
        linkedin: LinkedIn
        x: Close (X)
        plus: Plus
        exclamation: Exclamation
        check: Check
        dash: Dash
        question: Question
        info: Info
        search: Search
        person: Person
        people: People
        person-plus: Person Plus
        person-check: Person Check
        chevron-up: Chevron Up
        chevron-down: Chevron Down
        chevron-left: Chevron Left
        chevron-right: Chevron Right
        chevron-double-up: Chevron Double Up
        chevron-double-down: Chevron Double Down
        chevron-double-left: Chevron Double Left
        chevron-double-right: Chevron Double Right
        arrow-up: Arrow Up
        arrow-down: Arrow Down
        arrow-left: Arrow Left
        arrow-right: Arrow Right
        arrow-up-right: Arrow Up Right
        arrow-up-left: Arrow Up Left
        arrow-down-right: Arrow Down Right
        arrow-down-left: Arrow Down Left
        arrow-repeat: Arrow Repeat
        arrows-angle-expand: Expand
        arrows-angle-contract: Contract
        play: Play
        pause: Pause
        skip-backward: Skip Backward
        skip-forward: Skip Forward
        circle: Circle
        circle-fill: Circle Filled
        record-circle: Record Circle
        arrow-right-circle-fill: Arrow Right Circle Filled
        arrow-left-circle-fill: Arrow Left Circle Filled
        arrow-up-circle-fill: Arrow Up Circle Filled
        arrow-down-circle-fill: Arrow Down Circle Filled
        caret-right-fill: Caret Right Filled
        caret-left-fill: Caret Left Filled
        caret-up-fill: Caret Up Filled
        caret-down-fill: Caret Down Filled
    icon_first:
      type: boolean
      title: Change icon position to left
      default: false
      examples:
        - false
    alignment:
      type: string
      title: Alignment
      description: Alignment wrapper for a single button. Use Inline for multiple buttons.
      enum:
        - inline
        - left
        - center
        - right
      default: inline
      examples:
        - inline
      meta:enum:
        inline: Inline (default)
        left: Left
        center: Center
        right: Right
    full_width:
      type: boolean
      title: Full width
      description: Make the button full width using the Bootstrap w-100 utility class.
      default: false
      examples:
        - false
    radius:
      type: string
      title: Border radius
      description: Bootstrap border-radius utility class.
      enum:
        - rounded
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-pill
      default: rounded-1
      examples:
        - rounded-1
      meta:enum:
        rounded: Default
        rounded-0: None
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-pill: Round