$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Button
group: Base
status: stable

props:
  type: object
  required:
    - variant
    - size
  properties:
    variant:
      type: string
      title: Style
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
        - link
        - primary-inverted
        - secondary-inverted
        - outline-primary
        - outline-secondary
        - outline-success
        - outline-danger
        - outline-warning
        - outline-info
        - outline-light
        - outline-dark
      default: primary
      examples:
        - primary

    size:
      type: string
      title: Button size
      enum:
        - small
        - medium
        - large
      default: medium
      examples:
        - medium

    label:
      type: string
      title: Label
      default: "Button label"
      examples:
        - "Button label"

    href:
      type: string
      title: Link

    icon:
      type: string
      title: Icon
      enum:
        - arrow-right
        - arrow-left
        - caret-right
        - caret-left
        - download
        - user-plus
      examples:
        - arrow-right

    icon_first:
      type: boolean
      title: Display icon first
      default: false
      examples:
        - false

    mobile_width:
      type: boolean
      title: Full width on mobile
      default: false
      examples:
        - false

    full_width:
      type: boolean
      title: Full width (all breakpoints)
      default: false
      examples:
        - false

    disabled:
      type: boolean
      title: Disabled
      default: false
      examples:
        - false

    radius:
      type: string
      title: Border radius
      enum:
        - default
        - sm
        - lg
        - pill
        - none
      default: default
      meta:enum:
        default: Default
        sm: Small
        lg: Large
        pill: Pill
        none: None
      examples:
        - default

    btn_classes:
      type: string
      title: Extra CSS classes
      default: ""
      examples:
        - "fw-bold shadow-sm"
