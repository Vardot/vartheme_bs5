"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Icon
group: Base
status: stable

props:
  type: object
  properties:
    icon:
      type: string
      title: Icon name
      description: "Bootstrap icon ID (examples: rocket, arrow-right). Reference: https://icons.getbootstrap.com/"
      default: "rocket"

    icon_size:
      type: string
      title: Icon size
      description: "Select icon size."
      default: "small"
      enum:
        - "extra-small"
        - "small"
        - "medium"
        - "large"
        - "extra-large"

    color:
      type: string
      title: Color
      description: "Uses Bootstrap text-* utilities. The icon uses currentColor."
      default: "default"
      enum:
        - "default"
        - "primary"
        - "secondary"
        - "success"
        - "danger"
        - "warning"
        - "info"
        - "light"
        - "dark"
        - "muted"
        - "white"
      meta:
        enum:
          default: Default
          primary: Primary
          secondary: Secondary
          success: Success
          danger: Danger
          warning: Warning
          info: Info
          light: Light
          dark: Dark
          muted: Muted
          white: White

    alt:
      type: string
      title: Alt text
      description: "Leave empty for decorative icons."
      default: ""

    id:
      type: string
      title: HTML ID
      default: ""

    extra_classes:
      type: string
      title: Extra classes
      description: "Space separated classes (Bootstrap utilities allowed), e.g. me-2 align-middle."
      default: ""
