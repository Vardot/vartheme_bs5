$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon
group: Base
props:
  type: object
  properties:
    icon:
      type: string
      title: Icon
      description: Bootstrap Icon name (without the "bi-" prefix).
      enum:
        - facebook
        - twitter-x
        - instagram
        - linkedin
        - x
        - plus
        - exclamation
        - check
        - dash
        - question
        - info
        - search
        - person
        - people
        - person-plus
        - person-check
        - chevron-up
        - chevron-down
        - chevron-left
        - chevron-right
        - chevron-double-up
        - chevron-double-down
        - chevron-double-left
        - chevron-double-right
        - arrow-up
        - arrow-down
        - arrow-left
        - arrow-right
        - arrow-up-right
        - arrow-up-left
        - arrow-down-right
        - arrow-down-left
        - arrow-repeat
        - arrows-angle-expand
        - arrows-angle-contract
        - play
        - pause
        - skip-backward
        - skip-forward
        - circle
        - circle-fill
        - record-circle
        - house-door-fill
        - house-door
        - box-arrow-in-right
        - person-fill
        - person-circle
        - shield-check
        - chat-dots
        - laptop
        - gear
      default: people
      examples:
        - people
      meta:enum:
        facebook: Facebook
        twitter-x: Twitter X
        instagram: Instagram
        linkedin: LinkedIn
        x: Close (X)
        plus: Plus
        exclamation: Exclamation
        check: Check
        dash: Dash
        question: Question
        info: Info
        search: Search
        person: Person
        people: People
        person-plus: Person Plus
        person-check: Person Check
        chevron-up: Chevron Up
        chevron-down: Chevron Down
        chevron-left: Chevron Left
        chevron-right: Chevron Right
        chevron-double-up: Chevron Double Up
        chevron-double-down: Chevron Double Down
        chevron-double-left: Chevron Double Left
        chevron-double-right: Chevron Double Right
        arrow-up: Arrow Up
        arrow-down: Arrow Down
        arrow-left: Arrow Left
        arrow-right: Arrow Right
        arrow-up-right: Arrow Up Right
        arrow-up-left: Arrow Up Left
        arrow-down-right: Arrow Down Right
        arrow-down-left: Arrow Down Left
        arrow-repeat: Arrow Repeat
        arrows-angle-expand: Expand
        arrows-angle-contract: Contract
        play: Play
        pause: Pause
        skip-backward: Skip Backward
        skip-forward: Skip Forward
        circle: Circle
        circle-fill: Circle Filled
        record-circle: Record Circle
        house-door-fill: House (filled)
        house-door: House
        box-arrow-in-right: Sign In
        person-fill: Person (filled)
        person-circle: Person Circle
        shield-check: Shield Check
        chat-dots: Chat Dots
        laptop: Laptop
        gear: Gear
    icon_size:
      type: string
      title: Icon size
      description: Bootstrap font-size utility class used to control the icon size.
      enum:
      - fs-1
      - fs-2
      - fs-3
      - fs-4
      - fs-5
      - fs-6
      default: fs-4
      examples:
      - fs-4
      meta:enum:
        fs-1: Extra large
        fs-2: Large
        fs-3: Medium large
        fs-4: Medium
        fs-5: Small
        fs-6: Extra small
    color:
      type: string
      title: Color
      description: Bootstrap text color utility class used to control the color.
      enum:
      - text-body
      - text-primary
      - text-secondary
      - text-success
      - text-danger
      - text-warning
      - text-info
      - text-light
      - text-dark
      - text-white
      - text-muted
      - text-body-secondary
      - text-body-tertiary
      - text-primary-emphasis
      - text-secondary-emphasis
      - text-success-emphasis
      - text-danger-emphasis
      - text-warning-emphasis
      - text-info-emphasis
      default: text-body
      examples:
      - text-body
      meta:enum:
        text-body: Body
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-white: White
        text-muted: Muted
        text-body-secondary: Body secondary
        text-body-tertiary: Body tertiary
        text-primary-emphasis: Primary emphasis
        text-secondary-emphasis: Secondary emphasis
        text-success-emphasis: Success emphasis
        text-danger-emphasis: Danger emphasis
        text-warning-emphasis: Warning emphasis
        text-info-emphasis: Info emphasis
