$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Close button
description: A generic close button for dismissing content like modals and alerts.
noUi: true
props:
  type: object
  properties:
    size:
      type: string
      title: Size
      description: Bootstrap button size class
      enum:
        - ''
        - btn-sm
        - btn-lg
    disabled:
      type: boolean
      title: Disabled
      description: Disabled button
      default: false
    close_button_utility_classes:
      type: array
      title: Utility Classes
      default: []
      items:
        type: 'string'
      description: An array of utility classes that can be used to add extra Bootstrap utility classes or custom classes to this component.
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: HTML attributes for the close button element.
libraryOverrides:
  dependencies:
    - vartheme_bs5/bs-button-script
