<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1075" viewBox="0 0 1920 1075" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero placeholder image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1075" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#123B8A"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>

    <radialGradient id="blob1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 360) rotate(35) scale(540 420)">
      <stop stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1420 320) rotate(20) scale(620 480)">
      <stop stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 860) rotate(-10) scale(760 520)">
      <stop stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1075" fill="url(#bg)"/>

  <!-- Soft blobs -->
  <g filter="url(#soft)">
    <circle cx="520" cy="360" r="520" fill="url(#blob1)"/>
    <circle cx="1420" cy="320" r="560" fill="url(#blob2)"/>
    <circle cx="1180" cy="860" r="640" fill="url(#blob3)"/>
  </g>

  <!-- Subtle grid -->
  <rect width="1920" height="1075" fill="url(#grid)"/>

  <!-- Subtle vignette -->
  <path d="M0 0H1920V1075H0V0Z" fill="black" fill-opacity="0.10"/>
</svg>
