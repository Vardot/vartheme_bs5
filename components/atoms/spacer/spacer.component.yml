"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Spacer
group: Layout
description: "Bootstrap spacer for adding vertical space between sections."

props:
  type: object
  properties:
    size:
      type: string
      title: "Spacing size"
      description: "Bootstrap vertical spacing utility class applied directly to the spacer."
      enum:
        - "py-0"
        - "py-1"
        - "py-2"
        - "py-3"
        - "py-4"
        - "py-5"
      default: "py-3"
      examples:
        - "py-3"
      'meta:enum':
        py-0: "None"
        py-1: "Extra small"
        py-2: "Small"
        py-3: "Medium"
        py-4: "Large"
        py-5: "Extra large"
