"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Card
group: Card

props:
  type: object
  required:
    - heading_text
    - orientation
  properties:
    orientation:
      type: string
      title: Layout
      description: Controls how image and content are arranged.
      enum: [image-top, image-left, image-right, image-bottom]
      default: image-top
      examples: [image-top]
      meta:enum:
        image-top: Image on top
        image-left: Image on start
        image-right: Image on end
        image-bottom: Image on bottom
    content_vertical:
      type: string
      title: Content vertical alignment
      description: Controls vertical alignment of the content for image left and image right layouts.
      enum: [justify-content-start, justify-content-center, justify-content-end]
      default: justify-content-center
      examples: [justify-content-center]
      meta:enum:
        justify-content-start: Top
        justify-content-center: Center
        justify-content-end: Bottom
    heading_text:
      type: string
      title: Heading
      default: "This is your card title"
      examples:
        - "This is your card title"
    text:
      type: string
      title: Description
      description: Short supporting text under the heading.
      pattern: (.|\r?\n)*
      examples:
        - "A short description goes here."
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "/themes/contrib/vartheme_bs5/components/foundation/images/assets/teaser-1.png"
          width: 1200
          height: 900
          alt: "Placeholder card image"
    media_ratio:
      type: string
      title: Image ratio
      description: Controls the image ratio for top and bottom image layouts.
      enum: [auto, ratio-16x9, ratio-4x3, ratio-1x1]
      default: ratio-16x9
      examples: [ratio-16x9]
      meta:enum:
        auto: Auto
        ratio-16x9: Wide (16:9)
        ratio-4x3: Standard (4:3)
        ratio-1x1: Square (1:1)
    background:
      type: string
      title: Background theme
      description: Background color style for the card.
      enum: [bg-body, bg-light, bg-primary text-white, bg-dark text-white]
      default: bg-body
      examples: [bg-body]
      meta:enum:
        bg-body: Default
        bg-light: Light background
        bg-primary text-white: Primary background
        bg-dark text-white: Dark background
    shadow:
      type: string
      title: Shadow
      description: Adds depth to the card.
      enum: [shadow-sm, shadow, shadow-lg]
      default: shadow
      examples: [shadow]
      meta:enum:
        shadow-sm: Small shadow
        shadow: Default shadow
        shadow-lg: Large shadow
    has_padding:
      type: boolean
      title: Add padding
      description: If enabled, applies Bootstrap p-4 to the card body.
      default: true
      examples: [true]
    url:
      type: string
      title: Link URL (optional)
      format: uri-reference
      description: If provided, the whole card can link or show a button if label is set.
    button_label:
      type: string
      title: Button label (optional)
      description: If set and Link URL is provided, shows a button instead of linking the entire card.
      default: ""
      examples:
        - "Learn more"
    button_variant:
      type: string
      title: Button style
      description: Style for the optional button.
      enum: [btn-primary, btn-secondary, btn-success, btn-danger, btn-warning, btn-info, btn-light, btn-dark, btn-link]
      default: btn-primary
      examples: [btn-primary]
      meta:enum:
        btn-primary: Primary
        btn-secondary: Secondary
        btn-success: Success
        btn-danger: Danger
        btn-warning: Warning
        btn-info: Info
        btn-light: Light
        btn-dark: Dark
        btn-link: Link style
