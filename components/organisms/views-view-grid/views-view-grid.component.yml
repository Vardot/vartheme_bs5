$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Views view grid
description: Component implementation for views to display rows in a grid.
group: Views
noUi: true
use_in_views: true
props:
  type: object
  properties:
    grid_utility_classes:
      type: array
      title: 'Grid Row Utility Classes'
      default: []
      items:
        type: 'string'
      description: 'Use to add extra Bootstrap utility classes for the grid `row`. E.g. `row-cols-1 row-cols-sm-2 row-cols-md-4`. ( Do not add `grid`, or `row`).'
    column_utility_classes:
      type: array
      title: 'Column Utility Classes'
      default: []
      items:
        type: 'string'
      description: 'Use to add extra Bootstrap utility classes for the column `col`. E.g. `gy-4 g-sm-4` or `mb-4`. ( Do not add `col` or `col-[*]`).'
    col_xs:
      type: string
      title: Column width of items at xs breakpoint
      description: Set the number of columns each item should take up at the xs breakpoint and higher.
      enum:
        - "none"
        - "col"
        - "col-auto"
        - "col-1"
        - "col-2"
        - "col-3"
        - "col-4"
        - "col-6"
        - "col-12"
      meta:enum:
        "none" : "None (or inherit from previous)"
        "col" : "Equal"
        "col-auto" : "Fit to content"
        "col-1" : "1 (12 columns per row)"
        "col-2" : "2 (6 columns per row)"
        "col-3" : "3 (4 columns per row)"
        "col-4" : "4 (3 columns per row)"
        "col-6" : "6 (2 columns per row)"
        "col-12" : "12 (1 column per row)"
      x-translation-context: Column width of items at xs breakpoint
    col_sm:
      type: string
      title: Column width of items at sm breakpoint
      description: Set the number of columns each item should take up at the sm breakpoint and higher.
      enum:
        - "none"
        - "col-sm"
        - "col-sm-auto"
        - "col-sm-1"
        - "col-sm-2"
        - "col-sm-3"
        - "col-sm-4"
        - "col-sm-6"
        - "col-sm-12"
      meta:enum:
        "none" : "None (or inherit from previous)"
        "col-sm" : "Equal"
        "col-sm-auto" : "Fit to content"
        "col-sm-1" : "1 (12 columns per row)"
        "col-sm-2" : "2 (6 columns per row)"
        "col-sm-3" : "3 (4 columns per row)"
        "col-sm-4" : "4 (3 columns per row)"
        "col-sm-6" : "6 (2 columns per row)"
        "col-sm-12" : "12 (1 column per row)"
      x-translation-context: Column width of items at sm breakpoint
    col_md:
      type: string
      title: Column width of items at md breakpoint
      description: Set the number of columns each item should take up at the md breakpoint and higher.
      enum:
