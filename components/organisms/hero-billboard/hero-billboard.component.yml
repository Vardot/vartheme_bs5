$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero billboard
group: Hero
description: Bootstrap hero billboard with background image, overlay, and flexible content positioning.
props:
  type: object
  properties:
    container_type:
      type: string
      title: Container style
      description: Choose how the content is wrapped.
      enum:
        - container
        - container-fluid
        - container-sm
        - container-md
        - container-lg
        - container-xl
        - container-xxl
        - none
      default: container
      examples:
        - container
      meta:enum:
        container: Container (default)
        container-fluid: Full width
        container-sm: Small container
        container-md: Medium container
        container-lg: Large container
        container-xl: Extra large container
        container-xxl: Extra extra large container
        none: No container
    bg_edge2edge:
      type: boolean
      title: Background edge-to-edge
      description: If enabled, adds the bg-edge2edge class to the outer section so the background image can extend full width.
      default: false
      examples:
        - false
    height:
      type: string
      title: Hero height
      description: Choose the vertical size of the hero.
      enum:
        - ribbon
        - large
      default: ribbon
      examples:
        - ribbon
      meta:enum:
        ribbon: Ribbon (default)
        large: Large
    flex_position:
      type: string
      title: Content position
      enum:
        - top-left
        - center-left
        - bottom-left
        - hero-center
      default: center-left
      examples:
        - center-left
      meta:enum:
        top-left: Top left
        center-left: Center left
        bottom-left: Bottom left
        hero-center: Center
    overlay_bg:
      type: string
      title: Overlay background
      description: Bootstrap background utility class.
      default: bg-dark
      enum:
        - bg-dark
        - bg-black
        - bg-primary
        - bg-secondary
        - bg-success
        - bg-danger
        - bg-warning
        - bg-info
        - bg-white
      meta:enum:
        bg-dark: Dark
        bg-black: Black
        bg-primary: Primary
        bg-secondary: Secondary
        bg-success: Success
        bg-danger: Danger
        bg-warning: Warning
        bg-info: Info
        bg-white: White
    overlay_opacity:
      type: string
      title: Overlay opacity
      description: Bootstrap opacity utility class.
      default: opacity-50
      enum:
        - opacity-0
        - opacity-25
        - opacity-50
        - opacity-75
        - opacity-100
      meta:enum:
        opacity-0: 0% (none)
        opacity-25: 25%
        opacity-50: 50%
        opacity-75: 75%
        opacity-100: 100% (solid)
    content_width:
      type: string
      title: Content width
      description: Bootstrap width utility class.
      default: w-100
      enum:
        - w-100
        - w-75
        - w-50
        - w-25
      meta:enum:
        w-100: 100% (full)
        w-75: 75%
        w-50: 50%
        w-25: 25%
    object_position:
      type: string
      title: Background image position
      enum:
        - top
        - center
        - bottom
      default: center
      examples:
        - center
      meta:enum:
        top: Top
        center: Center
        bottom: Bottom
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Background image
      type: object
      examples:
        - src: assets/hero-bg-placeholder.svg
          alt: Placeholder image
          width: 1920
          height: 1075
slots:
  hero_slot:
    title: Hero content
