"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Hero Blog
description: "Blog hero with published date, title, and author."
group: Hero

props:
  type: object
  properties:
    heading_text:
      type: string
      title: "Title"
      default: "Enter the title"
      examples:
        - "Vivamus curae metus neque mollis orci ipsum sapien velit cursus"

    level:
      type: integer
      title: "Heading level"
      enum: [2, 3, 4, 5, 6]
      default: 2
      examples:
        - 2
      'meta:enum':
        2: "H2"
        3: "H3"
        4: "H4"
        5: "H5"
        6: "H6"

    heading_size:
      type: string
      title: "Heading size"
      description: "Visual size. Default follows the selected heading level."
      enum:
        - default
        - h2
        - h3
        - h4
        - h5
        - h6
        - display-1
        - display-2
        - display-3
        - display-4
        - display-5
        - display-6
      default: default
      examples:
        - default
      'meta:enum':
        default: "Default (match heading level)"
        h2: "Heading size: H2"
        h3: "Heading size: H3"
        h4: "Heading size: H4"
        h5: "Heading size: H5"
        h6: "Heading size: H6"
        display-1: "Display 1"
        display-2: "Display 2"
        display-3: "Display 3"
        display-4: "Display 4"
        display-5: "Display 5"
        display-6: "Display 6"

    date:
      type: string
      format: date
      title: "Date"
      description: "ISO 8601 date string (YYYY-MM-DD). Defaults to today's date."

    author:
      type: string
      title: "Author name"
      default: ""
      examples:
        - "John Smith"

    author_url:
      type: string
      title: "Author link"
      format: uri-reference
      description: "Optional URL for the author name."
      default: ""
      examples:
        - "https://example.com/author/john-smith"


slots:
  blog_media:
    title: "Blog media"
    description: "Optional media slot rendered above the content."
