$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero Slider (Container)
group: Hero
status: stable
description: >
  Bootstrap 5 Carousel container for Hero Slide items. Add unlimited slides by
  placing multiple "Hero Slide" components into the slot (drag & drop reorder).

props:
  type: object
  properties:
    bg_edge2edge:
      type: boolean
      title: Edge-to-edge background
      examples: [true]
      default: true

    transition:
      type: string
      title: Transition
      enum: [slide, fade]
      default: slide
      meta:enum:
        slide: Slide
        fade: Fade

    autoplay:
      type: boolean
      title: Autoplay
      examples: [true]
      default: true

    interval_ms:
      type: integer
      title: Autoplay interval (ms)
      default: 5000
      minimum: 1000
      maximum: 60000

    pause_on_hover:
      type: boolean
      title: Pause on hover
      examples: [true]
      default: true

    show_indicators:
      type: boolean
      title: Show indicators
      examples: [true]
      default: true

    show_controls:
      type: boolean
      title: Show prev/next controls
      examples: [true]
      default: true

    slider_height:
      type: [string, number]
      title: Slider height
      description: Fixed height presets (px).
      enum: ['500', '700', '900']
      default: '700'
      meta:enum:
        '500': 500px
        '700': 700px
        '900': 900px

    controller_color:
      type: string
      title: Controller color
      enum: [primary, light, dark, white]
      default: primary
      meta:enum:
        primary: Primary
        light: Light
        dark: Dark
        white: White

slots:
  slides:
    title: Slides
    description: Add one or more "Hero Slide" components here (unlimited, drag & drop reorder).

libraryOverrides:
  dependencies:
    - vartheme_bs5/framework
    # `framework` depends on `bootstrap-scripts` which already includes carousel.
