$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Card Icon
group: Card
props:
  type: object
  properties:
    text:
      type: string
      title: Heading
      description: Main title text.
      default: "Your heading here"
      examples:
        - "Your heading here"
    description:
      type: string
      title: Description
      description: Supporting text (HTML allowed).
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>This is placeholder text.</p>"
    text_align:
      type: string
      title: Text alignment
      description: Alignment applied to the icon, heading, and description.
      default: text-center
      examples: [text-center]
      enum:
        - text-start
        - text-center
        - text-end
      'meta:enum':
        text-start: Start
        text-center: Center
        text-end: End
    icon:
      type: string
      title: Icon (optional)
      description: 'Optional Bootstrap Icon name (without the "bi-" prefix). Use "none" to disable.'
      default: "people"
      examples:
        - "people"
      x-canvas-icon: ['bootstrap_icons']
    icon_size:
      type: string
      title: Icon size
      description: Controls the icon size using Bootstrap font-size utilities.
      enum:
        - fs-6
        - fs-5
        - fs-4
        - fs-3
        - fs-2
        - fs-1
      default: fs-4
      examples:
        - fs-4
      meta:enum:
        fs-6: Extra small
        fs-5: Small
        fs-4: Medium
        fs-3: Large
        fs-2: Extra large
        fs-1: Huge
    background_color:
      type: string
      title: Background theme
      description: Background color style for the card.
      enum: [bg-body, bg-primary text-white, bg-secondary text-white, bg-success text-white, bg-danger text-white, bg-warning, bg-info, bg-light, bg-dark text-white]
      default: bg-body
      examples: [bg-body]
      meta:enum:
        bg-body: Default
        bg-primary text-white: Primary
        bg-secondary text-white: Secondary
        bg-success text-white: Success
        bg-danger text-white: Danger
        bg-warning: Warning
        bg-info: Info
        bg-light: Light
        bg-dark text-white: Dark
    shadow:
      type: string
      title: Shadow
      description: Adds depth to the card.
      enum: [shadow-none, shadow-sm, shadow, shadow-lg]
      default: shadow
      examples: [shadow]
      meta:enum:
        shadow-none: No shadow
        shadow-sm: Small shadow
        shadow: Default shadow
        shadow-lg: Large shadow
    has_padding:
      type: boolean
      title: Add padding
      description: If enabled, applies Bootstrap p-4 to the card body.
      default: true
      examples: [true]
    url:
      type: string
      title: Link URL (optional)
      format: uri-reference
      description: If provided, the card becomes clickable or shows a button when button label is set.
    button_label:
      type: string
      title: Button label (optional)
      description: If set and Link URL is provided, shows a button instead of linking the full card.
      default: ""
      examples:
        - "Learn more"
    button_variant:
      type: string
      title: Button style
      description: Style for the optional button.
      enum: [btn-primary, btn-secondary, btn-success, btn-danger, btn-warning, btn-info, btn-light, btn-dark, btn-link]
      default: btn-primary
      examples: [btn-primary]
      meta:enum:
        btn-primary: Primary
        btn-secondary: Secondary
        btn-success: Success
        btn-danger: Danger
        btn-warning: Warning
        btn-info: Info
        btn-light: Light
        btn-dark: Dark
        btn-link: Link style
