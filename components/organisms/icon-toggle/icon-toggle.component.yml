$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon Toggle
status: stable
description: "A single icon button for the header/navbar (or anywhere else). Clicking it overlays a popover panel holding whatever is dropped into its 'content' slot — e.g. the 'Exposed form: search-page' block for a search toggle — without hiding the surrounding navigation; clicking again (or Escape / outside click) closes it."
group: Navigation
props:
  type: object
  properties:
    icon:
      type: string
      title: Icon
      description: Bootstrap Icon name shown in the closed state (without the "bi-" prefix). Swaps to a close (X) icon while the panel is open.
      default: search
      examples:
        - search
      x-canvas-icon: ['bootstrap_icons']
    label:
      type: string
      title: Label
      description: Accessible label for the button in its closed state (visually hidden).
      default: Search
      examples:
        - Search
    open_label:
      type: string
      title: Open state label
      description: Accessible label announced on the button while the panel is open.
      default: Close search
      examples:
        - Close search
    placement:
      type: string
      title: Panel alignment
      description: Which side of the button the popover panel aligns to (logical, RTL-aware).
      enum:
        - end
        - start
      meta:enum:
        end: End side
        start: Start side
      default: end
      examples:
        - end
    expand_in_editor:
      type: boolean
      title: Expand in Canvas editor
      description: Force the panel open while previewed inside the Drupal Canvas editor, so its "content" slot stays reachable for dropping components in. Turn off once content is placed, if the always-open panel clutters the editor view — the front-end open/close behavior is unaffected either way.
      default: true
      examples:
        - true
    panel:
      type: string
      title: Panel style
      description: "How the revealed panel looks. A boxed popover drops below the button; an inline bar stretches across the header row (desktop) or a full-width row below it (mobile), showing the icon, the field and a close button on one hairline-underlined line."
      enum:
        - popover
        - bar
      meta:enum:
        popover: Boxed popover
        bar: Inline bar
      default: popover
      examples:
        - popover
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: HTML attributes for the root element.
slots:
  content:
    title: Content
    description: "The content revealed in the popover, e.g. the 'Exposed form: search-page' block for a search toggle."
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    # Bootstrap 5.3's Dropdown plugin drives the disclosure (show/hide,
    # aria-expanded, Escape, outside click, focus return, and Popper's
    # flip/shift). It is not in the theme's global bootstrap-scripts bundle, so
    # the component asks for it and SDC attaches it only where it is used.
    - vartheme_bs5/bs-dropdown-script
