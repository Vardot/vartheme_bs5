$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Views view unformatted
description: Component implementation to display a view of unformatted rows.
group: Views
noUi: true
use_in_views: true
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: 'The title of this group of rows. May be empty.'
      default: ''
    default_row_class:
      type: boolean
      title: 'Default Row Class'
      description: 'Add a default "views-row" CSS class to each row wrapper.'
      default: false
      examples:
        - false
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: 'HTML attributes for the wrapping element.'
slots:
  rows:
    type: array
    title: 'Rows'
    description: 'Rows'
    items:
      type: 'object'
