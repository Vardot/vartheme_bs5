slots:
  overlay:
    title: Media overlay
    description: 'Drag & drop slot rendered as a badge overlay in the top-left corner of the media image. Drop a Badge or any inline element here. Renders even when no image is uploaded (shows placeholder).'
  content:
    title: Card content
    description: Drag & drop content slot for text, buttons, and other elements.
