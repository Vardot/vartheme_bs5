$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Media banner
group: Base
description: Bootstrap media banner with background image, overlay, and flexible content positioning.
props:
  type: object
  properties:
    container_type:
      type: string
      title: Container style
      description: Choose how the content is wrapped.
      enum:
        - container
        - container-fluid
        - container-sm
        - container-md
        - container-lg
        - container-xl
        - container-xxl
        - none
      default: container
      examples:
        - container
      meta:enum:
        container: Container (default)
        container-fluid: Full width
        container-sm: Small container
        container-md: Medium container
        container-lg: Large container
        container-xl: Extra large container
        container-xxl: Extra extra large container
        none: No container
    bg_edge2edge:
      type: boolean
      title: Background edge-to-edge
      description: If enabled, adds the bg-edge2edge class to the outer section so the background image can extend full width.
      default: false
      examples:
        - false
    height:
      type: string
      title: Banner height
      description: Choose the vertical size of the banner.
      enum:
        - ribbon
        - large
      default: ribbon
      examples:
        - ribbon
      meta:enum:
        ribbon: Ribbon (default)
        large: Large
    flex_position:
      type: string
      title: Content position
      enum:
        - top-left
        - center-left
        - bottom-left
        - hero-center
      default: center-left
      examples:
        - center-left
      meta:enum:
        top-left: Top left
        center-left: Center left
        bottom-left: Bottom left
        hero-center: Center
    overlay_bg:
      type: string
      title: Overlay background
      description: Bootstrap background utility class.
      default: bg-transparent
      examples:
        - bg-transparent
      enum:
        - bg-transparent
        - bg-dark
        - bg-black
        - bg-primary
        - bg-secondary
        - bg-success
        - bg-danger
        - bg-warning
        - bg-info
        - bg-white
      meta:enum:
        bg-transparent: Transparent
        bg-dark: Dark
        bg-black: Black
        bg-primary: Primary
        bg-secondary: Secondary
        bg-success: Success
        bg-danger: Danger
        bg-warning: Warning
        bg-info: Info
        bg-white: White
    overlay_opacity:
      type: string
      title: Overlay opacity
      description: Bootstrap opacity utility class.
      default: opacity-50
      examples:
        - opacity-50
      enum:
        - opacity-0
        - opacity-25
        - opacity-50
        - opacity-75
        - opacity-100
      meta:enum:
        opacity-0: 0% (none)
        opacity-25: 25%
        opacity-50: 50%
        opacity-75: 75%
        opacity-100: 100% (solid)
    content_width:
      type: string
      title: Content width
      description: Bootstrap width utility class.
      default: w-100
      examples:
        - w-100
      enum:
        - w-100
        - w-75
        - w-50
        - w-25
      meta:enum:
        w-100: 100% (full)
        w-75: 75%
        w-50: 50%
        w-25: 25%
    object_position:
      type: string
      title: Background image position
      enum:
        - top
        - center
        - bottom
      default: center
      examples:
        - center
      meta:enum:
        top: Top
        center: Center
        bottom: Bottom
    padding_inline_start:
      type: string
      title: Padding start
      description: Space inside the banner at the start side.
      enum:
        - none
        - ps-0
        - ps-1
        - ps-2
        - ps-3
        - ps-4
        - ps-5
      default: none
      examples:
        - none
      meta:enum:
        none: None
        ps-0: Remove
        ps-1: Small
        ps-2: Medium
        ps-3: Large
        ps-4: Extra large
        ps-5: XX-Large
    padding_inline_end:
      type: string
      title: Padding end
      description: Space inside the banner at the end side.
      enum:
        - none
        - pe-0
        - pe-1
        - pe-2
        - pe-3
        - pe-4
        - pe-5
      default: none
      examples:
        - none
      meta:enum:
        none: None
        pe-0: Remove
        pe-1: Small
        pe-2: Medium
        pe-3: Large
        pe-4: Extra large
        pe-5: XX-Large
    radius:
      type: string
      title: Border radius
      description: Bootstrap border-radius utility class.
      enum:
        - none
        - rounded
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-pill
      default: none
      examples:
        - none
      meta:enum:
        none: None
        rounded: Default
        rounded-0: Square
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-pill: Round
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Background image
      type: object
      examples:
        - src: assets/media-banner.webp
          alt: Placeholder image
          width: 1920
          height: 1075
slots:
  media_banner_slot:
    title: Media banner content
