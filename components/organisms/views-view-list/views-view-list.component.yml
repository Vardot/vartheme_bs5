"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata-full.schema.json"
name: Views View List
status: experimental
description: Implementation for displaying a view as a view list of items.
group: Views
props:
  type: object
  properties:
    type:
      type: string
      title: List type
      description: List type
      enum:
        - ul
        - ol
      meta:enum:
        ul: "Unordered list"
        ol: "Ordered list"
      x-translation-context: List type
      default: "ul"
    list_utility_classes:
      type: array
      title: List Utility Classes
      default: []
      items:
        type: 'string'
      description: Use to add extra Bootstrap utility classes or custom CSS classes over to the list.
    list_item_utility_classes:
      type: array
      title: List Item Utility Classes
      default: []
      items:
        type: 'string'
      description: Use to add extra Bootstrap utility classes or custom CSS classes over to list items.
    attributes:
      type: object
      title: Attributes
      description: "HTML attributes to apply to the list."
      $ref: 'ui-patterns://attributes'
slots:
  rows:
    title: Rows
    description: 'Data rows by view rows.'
