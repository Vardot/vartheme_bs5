$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Navbar
status: experimental
description: Navbar component
noUi: true
props:
  type: object
  properties:
    container:
      type:
      - string
      - 'null'
      title: Container
      description: Container type
      default: ''
      enum:
      - ''
      - no-container
      - container-sm
      - container
      - container-md
      - container-lg
      - container-xl
      - container-xxl
      - container-fluid
      - null
    color_mode:
      type: string
      default: ''
      enum:
      - ''
      - light
      - dark
    color:
      type: string
      default: ''
      enum:
      - transparent
      - light
      - dark
      - black
      - white
      - primary
      - secondary
      - success
      - danger
      - warning
      - info
    placement:
      type: string
      default: ''
      enum:
      - ''
      - fixed-top
      - fixed-bottom
      - sticky-top
    navbar_expand:
      type: string
      default: ''
      enum:
      - ''
      - sm
      - md
      - lg
      - xl
    navbar_utility_classes:
      type: array
      items:
        type: string
      default: []
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: HTML attributes for the navbar element
slots:
  branding:
    title: Branding
  navigation:
    title: Navigation
libraryOverrides:
  dependencies:
  - vartheme_bs5/bs-dropdown-script
  - core/components.vartheme_bs5--navbar-brand
