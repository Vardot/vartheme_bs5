$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero side by side
group: Hero
props:
  type: object
  properties:
    bg_edge2edge:
      type: boolean
      title: Edge-to-edge background
      description: When enabled, adds the class bg-edge2edge so the background spans the full width.
      default: false
    heading:
      type: string
      title: Heading
      examples:
        - Build better digital experiences
    heading_level:
      type: integer
      title: Heading level
      enum: [2, 3, 4, 5, 6]
      default: 2
      examples:
        - 2
      meta:enum:
        2: H2
        3: H3
        4: H4
        5: H5
        6: H6
    text:
      type: string
      title: Description text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - <p>Create flexible, scalable Drupal experiences using modern components.</p>
    image:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: assets/image-placeholder.svg
          alt: Hero image
          width: 1200
          height: 900
    image_position:
      type: string
      title: Image position
      enum: [right, left]
      default: right
      examples:
        - right
      meta:enum:
        right: Image end
        left: Image start
    align:
      type: string
      title: Content alignment
      default: text-start
      examples:
        - text-start
      enum:
        - text-start
        - text-center
        - text-end
      'meta:enum':
        text-start: Start
        text-center: Center
        text-end: End
    background_color:
      type: string
      title: Background color
      description: Bootstrap background utility applied to the section.
      enum:
        - bg-none
        - bg-white
        - bg-primary
        - bg-secondary
        - bg-success
        - bg-danger
        - bg-warning
        - bg-info
        - bg-light
        - bg-dark
      default: bg-white
      meta:enum:
        bg-none: None (transparent)
        bg-white: White
        bg-primary: Primary
        bg-secondary: Secondary
        bg-success: Success
        bg-danger: Danger
        bg-warning: Warning
        bg-info: Info
        bg-light: Light
        bg-dark: Dark
    content_color:
      type: string
      title: Text color
      description: Controls the text color for heading and description.
      enum:
        - text-white
        - text-dark
      default: text-dark
      meta:enum:
        text-dark: Dark text
        text-white: Light text
    background_image:
      $ref: json-schema-definitions://canvas.module/image
      title: Background image (optional)
      description: Optional background image applied to the section. Leave empty for a solid background color.
      type: object
    background_overlay_color:
      type: string
      title: Background overlay color
      description: Optional overlay placed over the background image.
      enum:
        - bg-none
        - bg-dark
        - bg-light
        - bg-primary
        - bg-secondary
      default: bg-none
      meta:enum:
        bg-none: No overlay
        bg-dark: Dark
        bg-light: Light
        bg-primary: Primary
        bg-secondary: Secondary
    background_overlay_opacity:
      type: integer
      title: Overlay opacity
      description: Bootstrap opacity utility applied to the overlay.
      enum: [0, 25, 50, 75, 100]
      default: 50
      meta:enum:
        0: 0% (transparent)
        25: 25%
        50: 50%
        75: 75%
        100: 100% (solid)
    vertical_padding:
      type: string
      title: Vertical padding
      description: Top and bottom space using Bootstrap py-* utilities.
      enum:
        - py-0
        - py-3
        - py-4
        - py-5
      default: py-4
      meta:enum:
        py-0: None
        py-3: Small
        py-4: Medium
        py-5: Large
    button_label:
      type: string
      title: Button label (optional)
      examples:
        - Get started
    button_url:
      type: string
      title: Button link (optional)
    button_variant:
      type: string
      title: Button style
      description: Bootstrap button variant.
      enum:
        - btn-primary
        - btn-secondary
        - btn-success
        - btn-danger
        - btn-warning
        - btn-info
        - btn-light
        - btn-dark
        - btn-link
      default: btn-primary
      meta:enum:
        btn-primary: Primary
        btn-secondary: Secondary
        btn-success: Success
        btn-danger: Danger
        btn-warning: Warning
        btn-info: Info
        btn-light: Light
        btn-dark: Dark
        btn-link: Link
    button_outline:
      type: boolean
      title: Outline button style
      description: When enabled, uses the Bootstrap outline style for the selected button variant, except for link buttons.
      default: false
    button_size:
      type: string
      title: Button size
      description: Optional Bootstrap button size.
      enum:
        - btn-md
        - btn-sm
        - btn-lg
      default: btn-md
      meta:enum:
        btn-md: Medium (default)
        btn-sm: Small
        btn-lg: Large
    button_target:
      type: string
      title: Button target
      enum:
        - self
        - blank
      default: self
      examples:
        - self
      meta:enum:
        self: Same tab
        blank: New tab
