<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"></stop>
      <stop offset="100%" stop-color="#e0f2fe"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.45"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="48" fill="url(#bg)"></rect>

  <!-- Decorative shapes -->
  <circle cx="260" cy="240" r="220" fill="url(#accent)"></circle>
  <circle cx="980" cy="640" r="260" fill="url(#accent)"></circle>

  <!-- Image frame -->
  <rect x="200" y="180" width="800" height="440" rx="32" fill="#ffffff" fill-opacity="0.55"></rect>

  <!-- Image icon -->
  <g transform="translate(500 330)" fill="#0f172a" fill-opacity="0.35">
    <rect x="-120" y="-80" width="240" height="160" rx="16"></rect>
    <circle cx="-60" cy="-20" r="18"></circle>
    <path d="M-120 60l70-70 50 50 40-40 80 80z"></path>
  </g>

  <!-- Caption text -->
  <text x="600" y="690" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" fill="#0f172a" fill-opacity="0.55">
    Image placeholder
  </text>
</svg>
