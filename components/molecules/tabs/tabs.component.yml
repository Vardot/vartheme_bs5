$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tabs
status: experimental
description: Tabs
props:
  type: object
  properties:
    shape:
      type: string
      title: Shape
      enum:
        - tabs
        - pills
    attributes:
      type: object
      title: Attributes
      description: HTML attributes for the containing element.
      properties:
        class:
          type: string
          default: ''
        id:
          type: string
          default: ''
      additionalProperties: true
libraryOverrides:
  dependencies:
    - vartheme_bs5/bs-tab-script
