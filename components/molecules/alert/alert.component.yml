"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Alert
group: Feedback
status: stable
description: "Bootstrap alert component."

props:
  type: object
  properties:
    type:
      type: string
      title: "Alert type"
      description: "Bootstrap alert variant class."
      default: ""
      enum:
        - ""
        - alert-primary
        - alert-secondary
        - alert-success
        - alert-danger
        - alert-warning
        - alert-info
        - alert-dark
        - alert-light

    dismissible:
      type: boolean
      title: "Dismissible"
      description: "Show dismiss button."
      default: false

    heading:
      type: string
      title: "Heading"
      default: ""

    message:
      type: string
      title: "Message"
      default: ""

    html_id:
      type: string
      title: "HTML ID"
      default: ""

    extra_classes:
      type: string
      title: "Extra classes"
      default: ""

slots:
  content:
    title: "Content"
