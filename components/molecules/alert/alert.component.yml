"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Alert
description: "Alerts are available for any length of text, as well as an optional close button."

props:
  type: object
  properties:
    variant:
      type: string
      title: Alert variant
      description: "Bootstrap predefined alert classes."
      default: ""
      enum:
        - ""
        - alert-primary
        - alert-secondary
        - alert-success
        - alert-danger
        - alert-warning
        - alert-info
        - alert-dark
        - alert-light

    dismissible:
      type: boolean
      title: Dismissible
      description: "Show close button."
      default: false

    alert_utility_classes:
      type: array
      title: Utility classes
      default: []
      items:
        type: string
      description: "Extra Bootstrap utility / custom classes."

    attributes:
      type: object
      title: Attributes
      description: "HTML attributes for the alert element."
      additionalProperties: true
      default: {}

    dismissible_attributes:
      type: object
      title: Dismiss close button attributes
      description: "HTML attributes for the close button."
      additionalProperties: true
      default: {}

slots:
  heading:
    title: Alert heading
  content:
    title: Alert content

libraryOverrides:
  dependencies:
    - vartheme_bs5/bs-alert-script
