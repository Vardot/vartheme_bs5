$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion container
description: A container for any content, only one of whose accordions may be open
  at a time.
group: Layout
props:
  type: object
  properties:
    id:
      type: string
      title: Accordion ID
      description: Used for data-bs-parent binding. Leave empty to auto-generate.
      default: ''
    flush:
      type: boolean
      title: Flush style
      description: Bootstrap accordion-flush style.
      default: false
    always_open:
      type: boolean
      title: Always open
      description: Allow multiple accordion items to stay open (no data-bs-parent).
      default: false
    extra_classes:
      type: string
      title: Extra classes
      description: Space separated classes (Bootstrap utilities allowed).
      default: ''
    color:
      type: string
      title: Header color
      description: Applies Bootstrap color utilities to accordion headers (buttons).
      enum:
        - default
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
      meta:
        enum:
          default: Default
          primary: Primary
          secondary: Secondary
          success: Success
          danger: Danger
          warning: Warning
          info: Info
          light: Light
          dark: Dark
      default: default
slots:
  accordion_content:
    title: Accordion content
    description: Only one of collapsible sections added can be open at a time.
libraryOverrides:
  dependencies:
    - vartheme_bs5/bs-collapse-script
