$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion container
description: A container for any content, only one of whose accordions may be open at a time.
group: Layout
props:
  type: object
  properties:
    id:
      type: string
      title: Accordion ID
      description: Used for data-bs-parent binding. Leave empty to auto-generate.
      default: ''
    flush:
      type: boolean
      title: Flush style
      description: Remove the default outer accordion borders and rounding.
      default: false
      examples:
        - false
    always_open:
      type: boolean
      title: Keep multiple items open
      description: Allow multiple accordion items to stay open at the same time.
      default: false
      examples:
        - false
    color:
      type: string
      title: Header color override
      description: Optional Bootstrap text-bg-* class passed to nested accordion items. Omit to use the default design (secondary-subtle bg, dark text, secondary hover, primary hover text).
      enum:
        - text-bg-primary
        - text-bg-secondary
        - text-bg-success
        - text-bg-danger
        - text-bg-warning
        - text-bg-info
        - text-bg-dark
      meta:enum:
          text-bg-primary: Primary
          text-bg-secondary: Secondary
          text-bg-success: Success
          text-bg-danger: Danger
          text-bg-warning: Warning
          text-bg-info: Info
          text-bg-dark: Dark

slots:
  accordion_content:
    title: Accordion content
    description: Place one or more accordion items inside this slot.

libraryOverrides:
  js:
    accordion-container.js: {}
  dependencies:
    - vartheme_bs5/bs-collapse-script
